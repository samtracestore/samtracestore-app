<style>
  :root{
    --bg:#0B1120; --panel:#111827; --panel2:#1A2333;
    --accent:#FF7A1A; --accent2:#FFB067; --text:#F4F6FA; --muted:#8B95A8;
    --border:#232E44; --ok:#3ECF8E; --warn:#F5B93D; --info:#60A5FA; --danger:#EF5D5D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0B1120 0%,#0D1420 100%);}
  header.top{padding:18px 20px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;
    border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,17,32,0.92);
    backdrop-filter:blur(8px);z-index:10;}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#FF4D1A);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;
    box-shadow:0 4px 14px rgba(255,122,26,0.35);}
  header.top .titles{flex:1;}
  header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.2px;}
  header.top p{font-size:11.5px;margin:2px 0 0;color:var(--muted);}
  .modeSwitch{display:flex;gap:6px;background:var(--panel2);padding:4px;border-radius:10px;order:3;width:100%;}
  .modeSwitch button{flex:1;}
  #companyBar{display:none;padding:10px 20px 0;}
  .bigOrange{display:flex;align-items:center;gap:12px;text-align:left;font-size:16px;padding:18px 16px;margin-bottom:12px;}
  .bigOrange .bi{font-size:28px;line-height:1;}
  .modeSwitch button{border:none;background:transparent;color:var(--muted);font-size:12px;
    padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600;}
  .modeSwitch button.active{background:var(--accent);color:#0B1120;}
  main{flex:1;padding:20px;padding-bottom:230px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;}
  .card h2{font-size:14.5px;margin:0 0 4px;font-weight:700;}
  .card p.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.5;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:12px 13px;font-size:14.5px;margin-bottom:12px;outline:none;}
  input:focus,select:focus{border-color:var(--accent);}
  input::placeholder{color:#556077;}
  button.primary{width:100%;background:linear-gradient(135deg,var(--accent),#FF5A1A);color:#fff;
    border:none;border-radius:10px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 16px rgba(255,122,26,0.3);}
  button.primary:active{transform:scale(0.98);}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;}
  .pkg{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:12px;}
  .pkg .row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .pkg .tid{font-weight:700;font-size:14px;}
  .pkg .desc{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap;}
  .badge.preparation{background:rgba(139,149,168,0.18);color:var(--muted);}
  .badge.expedie{background:rgba(96,165,250,0.15);color:var(--info);}
  .badge.livraison{background:rgba(255,122,26,0.18);color:#FF9A4D;}
  .badge.attente{background:rgba(245,185,61,0.15);color:var(--warn);}
  .badge.disponible{background:rgba(219,39,119,0.15);color:#EC4899;}
  .courierStrip{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,122,26,0.10);border:1px solid rgba(255,122,26,0.35);}
  .courierStrip .cAvWrap{width:84px;height:84px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid var(--accent);}
  .courierStrip .cAvWrap.wide{width:150px;height:84px;border-radius:14px;}
  .courierStrip .cAv{width:100%;height:100%;object-fit:cover;display:block;}
  .courierStrip .cMoto{font-size:46px;line-height:1;display:inline-block;}
  .courierStrip.go .cMoto{animation:motoRide 1.6s ease-in-out infinite;}
  @keyframes motoRide{0%{transform:translateX(-4px)}50%{transform:translateX(8px)}100%{transform:translateX(-4px)}}
  .badge.livre{background:rgba(62,207,142,0.15);color:var(--ok);}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .big{font-size:36px;margin-bottom:10px;}
  footer.share{position:fixed;bottom:66px;left:0;right:0;max-width:480px;margin:0 auto;
    padding:14px 20px 22px;background:linear-gradient(0deg,var(--bg) 60%,transparent);pointer-events:none;}
  .waBtn{width:100%;background:#25D366;color:#06210F;border:none;border-radius:12px;
    padding:14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
    gap:8px;cursor:pointer;box-shadow:0 6px 18px rgba(37,211,102,0.35);pointer-events:auto;}
  .menuBackBtn{display:inline-flex;align-items:center;gap:8px;width:auto;padding:9px 16px;border:none;border-radius:12px;cursor:pointer;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--accent),#FF5A1A);box-shadow:0 4px 14px rgba(255,106,0,0.4);}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1A2333;
    border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:50;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;
    align-items:center;justify-content:center;padding:20px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
  .lightbox .closeBtn{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.15);
    color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;}
  .compactCard{background:var(--panel);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;margin-bottom:14px;cursor:pointer;}
  .compactBanner{height:64px;display:flex;align-items:center;justify-content:center;}
  .compactIcon{font-size:26px;}
  .compactBody{padding:12px 16px;}
  .compactTitle{font-weight:700;font-size:14px;}
  .compactSub{color:var(--muted);font-size:12px;margin-top:2px;}
  .pkgAdmin{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);
    border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .pkgAdmin .info{font-size:13px;}
  .pkgAdmin .info .name{color:var(--muted);font-size:11.5px;}
  .miniBtn{background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;}
  .warnBox{background:rgba(245,185,61,0.1);border:1px solid rgba(245,185,61,0.3);color:var(--warn);
    border-radius:10px;padding:12px;font-size:12px;line-height:1.5;margin-bottom:14px;}
  .histline{display:flex;gap:10px;font-size:12px;color:var(--muted);padding:4px 0;}
  .histline .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0;}
  .editBtn{background:rgba(255,122,26,0.15);border:1px solid var(--accent);color:var(--accent);
    border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;margin-right:6px;}
  .editingBanner{background:rgba(255,122,26,0.12);border:1px solid var(--accent);color:var(--accent2);
    border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;display:flex;
    justify-content:space-between;align-items:center;}
  .pickupBtn{width:100%;margin-top:12px;background:linear-gradient(135deg,#EC4899,#BE185D);color:#fff;
    border:none;border-radius:10px;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .confettiPiece{position:fixed;top:-40px;font-size:22px;z-index:999;pointer-events:none;
    animation:confettiFall linear forwards;}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(110vh) rotate(360deg);opacity:0.9;}
  }
</style>
</head>

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3I7fB6HuuvTUtBYLM8gKjlxiEH1Bx_uKsRGtOyJXTbILT9a_fkUuarFlXdXFpI4be/exec";
const appsScriptReady = APPS_SCRIPT_URL !== "VOTRE_APPS_SCRIPT_URL";

async function sendViaAppsScript(pkg, client){
  if(!appsScriptReady) return;
  await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({
      to_email: client.email,
      name: client.name || pkg.name || '',
      message: buildStatusMessage(pkg),
      email: client.email,
      company_name: adminSession && adminSession.companyName ? adminSession.companyName : 'Sam Trace Store'
    })
  });
  incrementGoogleScriptQuota();
}

function buildStatusMessage(pkg){
  const statusMsg = STATUS_EMAIL_MESSAGE[pkg.status] || '';
  const statusLabel = STATUS_LABEL[pkg.status] || pkg.status;
  return `${statusMsg}\n\nNuméro de suivi : ${pkg.trackingId}\nStatut actuel : ${statusLabel}`;
}

async function sendStatusEmail(pkg){
  if(!emailjsReady && !appsScriptReady) return;
  const recipients = [];
  const client = await getClient(pkg.phone);
  if(client && client.email) recipients.push({email: client.email, name: client.name || pkg.name || ''});
  const alertSub = await getTrackingAlert(pkg.trackingId);
  if(alertSub && alertSub.email && !recipients.some(r=> r.email.toLowerCase() === alertSub.email.toLowerCase())){
    recipients.push({email: alertSub.email, name: pkg.name || ''});
  }
  for(const r of recipients){
    let emailjsFailed = false;
    if(emailjsReady){
      try{
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: r.email,
          name: r.name,
          message: buildStatusMessage(pkg),
          email: r.email,
          company_name: adminSession && adminSession.companyName ? adminSession.companyName : 'Sam Trace Store'
        });
        incrementEmailQuota();
      }catch(e){
        console.warn('EmailJS a échoué, tentative via Google Apps Script', e);
        emailjsFailed = true;
      }
    }
    if((!emailjsReady || emailjsFailed) && appsScriptReady){
      try{ await sendViaAppsScript(pkg, {email: r.email, name: r.name}); }
      catch(e){ console.warn('Google Apps Script a échoué aussi', e); }
    }
  }
}

async function saveTrackingAlert(trackingId, email){
  await db.collection('trackingAlerts').doc(trackingId).set({email, createdAt:new Date().toISOString()});
}

async function getTrackingAlert(trackingId){
  try{
    const doc = await db.collection('trackingAlerts').doc(trackingId).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ return null; }
}

  let p = normalizePhone(phone);
  if(p.startsWith('+509')) p = p.slice(4);

const LOGIN_LOCKOUT_LS_KEY = 'sts_login_lockout';
const MAX_LOGIN_ATTEMPTS = 5;
const LOCKOUT_MINUTES = 10;
try{ localStorage.removeItem(LOGIN_LOCKOUT_LS_KEY); }catch(e){}
// Chaque espace (admin / company) a son propre compteur : un blocage dans l'un n'affecte pas l'autre.
function lockKey(scope){ return LOGIN_LOCKOUT_LS_KEY + '_' + (scope || 'company'); }
function getLoginLockoutState(scope){
  try{
    const raw = localStorage.getItem(lockKey(scope));
    return raw ? JSON.parse(raw) : {count:0, lockedUntil:0};
  }catch(e){ return {count:0, lockedUntil:0}; }
}
function setLoginLockoutState(scope, state){
  try{ localStorage.setItem(lockKey(scope), JSON.stringify(state)); }catch(e){}
}
function registerFailedLogin(scope){
  const state = getLoginLockoutState(scope);
  state.count = (state.count||0) + 1;
  if(state.count >= MAX_LOGIN_ATTEMPTS){
    state.lockedUntil = Date.now() + LOCKOUT_MINUTES*60*1000;
    state.count = 0;
  }
  setLoginLockoutState(scope, state);
}
function clearLoginLockout(scope){
  setLoginLockoutState(scope, {count:0, lockedUntil:0});
}
function checkLoginLockout(scope){
  const state = getLoginLockoutState(scope);
  if(state.lockedUntil && Date.now() < state.lockedUntil){
    const minutesLeft = Math.ceil((state.lockedUntil - Date.now())/60000);
    return minutesLeft;
  }
  return 0;
}
// Lecture Firestore avec nouvelles tentatives : une coupure réseau ne doit jamais compter comme un mauvais code.
async function firestoreGetWithRetry(ref){
  let lastErr;
  for(let i = 0; i < 3; i++){
    try{ return await ref.get({source: 'server'}); }catch(e){ lastErr = e; }
    try{ const c = await ref.get(); if(c && c.exists) return c; }catch(e){ lastErr = e; }
    await new Promise(r => setTimeout(r, 700 * (i + 1)));
  }
  throw lastErr || new Error('network');
}

  const existing = await db.collection('companies').doc(code).get();
  if(existing.exists){
    const sameCompanyPhone = normalizePhone(existing.data().companyPhone) === normalizePhone(companyPhone);
    const err = new Error(sameCompanyPhone ? 'ALREADY_REGISTERED' : 'CODE_TAKEN');

    throw err;
  }
  await db.collection('companies').doc(code).set({
    code, companyName, companyPhone: normalizePhone(companyPhone),
    adminName, adminEmail, adminPhone: normalizePhone(adminPhone),
    blocked:false, seenByOwner:false, justUnblocked:false,
    paymentStatus:'none', notifiedForPayment:true,
    regPaymentStatus:'none', notifiedForRegPayment:true,

  return code;

function compressImage(file, maxSizeArg){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxSize = maxSizeArg || 200;
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = h*(maxSize/w); w = maxSize; } }
        else { if(h > maxSize){ w = w*(maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressProofImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxSize = 1400;
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = h*(maxSize/w); w = maxSize; } }
        else { if(h > maxSize){ w = w*(maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressLogo(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const m = 1200; let w = img.width, h = img.height;
        if(w > h){ if(w > m){ h = h*(m/w); w = m; } } else { if(h > m){ w = w*(m/h); h = m; } }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        let out = c.toDataURL('image/jpeg', 0.92);
        if(out.length > 700000) out = c.toDataURL('image/jpeg', 0.8);
        if(out.length > 700000) out = c.toDataURL('image/jpeg', 0.65);
        resolve(out);
      };
      img.onerror = reject; img.src = e.target.result;
    };
    r.onerror = reject; r.readAsDataURL(file);
  });
}

    const doc = await db.collection('settings').doc('emailQuota').get();
    const data = doc.exists ? doc.data() : {};
    const month = currentMonthKey();
    const count = (data.month === month) ? (data.count || 0) : 0;
    return { total: EMAILJS_MONTHLY_QUOTA, used: count, remaining: Math.max(0, EMAILJS_MONTHLY_QUOTA - count), month };
  }catch(e){
    return { total: EMAILJS_MONTHLY_QUOTA, used: 0, remaining: EMAILJS_MONTHLY_QUOTA, month: currentMonthKey() };
  }
}

async function incrementEmailQuota(){

    await ref.set({ month, count: count + 1 }, {merge:true});
  }catch(e){}
}

const OWNER_NOTIFY_EMAIL = "samtracestore00@gmail.com";

async function sendOwnerPaymentNotification(company, data, type){
  if(!appsScriptReady && !emailjsReady) return;
  const label = type === 'registration' ? 'inscription' : 'recharge';
  const companyLabel = (company && (company.companyName || company.code)) || 'Entreprise inconnue';
  const message = `Nouveau dépôt (${label}) reçu.\n\nEntreprise : ${companyLabel}\nCode : ${company ? company.code : ''}\nMontant : ${data.amount} ${data.currency}\nMéthode : ${data.method}\nEnvoyé par : ${data.firstName || ''} ${data.name || ''}\nTéléphone : ${data.phone || ''}`;
  let sent = false;
  if(appsScriptReady){
    try{
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain'},
        body: JSON.stringify({
          to_email: OWNER_NOTIFY_EMAIL,
          name: 'Sam Trace Store',
          message: message,
          email: OWNER_NOTIFY_EMAIL,
          company_name: 'Sam Trace Store'
        })
      });
      incrementGoogleScriptQuota();
      sent = true;
    }catch(e){ console.warn('Notification email (Apps Script) échouée', e); }
  }
  if(!sent && emailjsReady){
    try{
      await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
        to_email: OWNER_NOTIFY_EMAIL,
        name: 'Sam Trace Store',
        message: message,
        email: OWNER_NOTIFY_EMAIL,
        company_name: 'Sam Trace Store'
      });
      incrementEmailQuota();
    }catch(e){ console.warn('Notification email (EmailJS) échouée', e); }
  }
}

let pendingListenerUnsub = null;
let lastKnownPendingCount = null;
let notifAudioCtx = null;
let notifAudioUnlocked = false;

function unlockNotifAudio(){
  const el = document.getElementById('notifSound');
  if(el && !notifAudioUnlocked){
    el.muted = true;
    el.play().then(()=>{
      el.pause();
      el.currentTime = 0;
      el.muted = false;
      notifAudioUnlocked = true;
    }).catch(()=>{});
  }
  if(!notifAudioCtx){
    try{ notifAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(notifAudioCtx && notifAudioCtx.state === 'suspended'){ notifAudioCtx.resume().catch(()=>{}); }
}
document.addEventListener('click', unlockNotifAudio, {once:false});
document.addEventListener('touchstart', unlockNotifAudio, {once:false});

function playNotificationSound(){
  const el = document.getElementById('notifSound');
  if(el){
    try{
      el.currentTime = 0;
      const p = el.play();
      if(p && p.catch) p.catch(()=>{ playBeepFallback(); });
    }catch(e){ playBeepFallback(); }
  } else {
    playBeepFallback();
  }
}

function playBeepFallback(){
  try{
    if(!notifAudioCtx) notifAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = notifAudioCtx;
    const now = ctx.currentTime;
    [0, 0.16].forEach((offset, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = i === 0 ? 880 : 1046.5;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.3);
    });
  }catch(e){}
}

}

}

function startPendingListener(){
  if(pendingListenerUnsub || !firebaseReady) return;
  try{
    pendingListenerUnsub = db.collection('companies').onSnapshot(snap=>{
      let count = 0;
      snap.forEach(doc=>{
        const d = doc.data();
        if(d.paymentStatus === 'pending') count++;
        if(d.regPaymentStatus === 'pending') count++;
      });
      const lastSeen = lastKnownPendingCount !== null ? lastKnownPendingCount : getStoredPendingCount();
      if(count > lastSeen){
        playNotificationSound();
        if(adminSession && adminSession.isOwner) renderAdmin();
      }
      lastKnownPendingCount = count;
      setStoredPendingCount(count);
    });
  }catch(e){}
}

function stopPendingListener(){
  if(pendingListenerUnsub){ try{ pendingListenerUnsub(); }catch(e){} pendingListenerUnsub = null; }
  lastKnownPendingCount = null;
}

async function logPackageChange(prev, pkg){
  const code = pkg.companyCode || await getOwnerCode();
  const who = (pkg.name || '') + (pkg.phone ? ' · ' + pkg.phone : '');
  const id = '#' + pkg.trackingId;
  if(!prev){
    const dest = [pkg.destCommune, pkg.destDepartment, pkg.destCountry].filter(Boolean).join(', ');
    await logActivity(code, '📦', 'Nouveau colis ajouté', id + ' — ' + who + (dest ? ' — ' + dest : ''), pkg.trackingId);
  } else if(!prev.pickedUpAt && pkg.pickedUpAt){
    await logActivity(code, '🎉', 'Colis récupéré par le client', id + ' — ' + who, pkg.trackingId);
  } else if(prev.status !== pkg.status){
    await logActivity(code, '🔄', 'Statut changé', id + ' — ' + who + ' : ' + (STATUS_LABEL[prev.status] || prev.status) + ' → ' + (STATUS_LABEL[pkg.status] || pkg.status), pkg.trackingId);
  }
}
async function savePackage(pkg){
  let prev = null;
  try{ const d = await db.collection('packages').doc(pkg.trackingId).get(); prev = d.exists ? d.data() : null; }catch(e){}
  await db.collection('packages').doc(pkg.trackingId).set(pkg);
  try{ await logPackageChange(prev, pkg); }catch(e){ console.warn('Journal colis', e); }
}

let audioCtx = null;
function playPouf(delay){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    const startTime = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, startTime);
    osc.frequency.exponentialRampToValueAtTime(80, startTime + 0.15);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.35, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + 0.2);
  }catch(e){}
}

function triggerConfetti(){
  const emojis = ['🎉','🎊','✨','🎈'];
  for(let i=0;i<28;i++){
    const el = document.createElement('div');
    el.className = 'confettiPiece';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = (Math.random()*100)+'vw';
    el.style.animationDuration = (2 + Math.random()*1.5)+'s';
    el.style.animationDelay = (Math.random()*0.4)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 4000);
  }
  for(let i=0;i<6;i++){
    playPouf(i * 0.12 + Math.random()*0.05);
  }
}

  ).join('');
  const pickupBtn = (p.status === 'disponible' || p.status === 'livraison')
    ? `<button class="pickupBtn" data-pickup="${p.trackingId}">🎉 J'ai récupéré mon colis</button>`
    : '';
  return `<div class="pkg">
    <div class="row1">
      <div>
        ${(label && typeof label === 'string') ? `<div style="display:inline-block;background:rgba(255,122,26,0.15);color:var(--accent2);border:1px solid var(--accent);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:800;margin-bottom:6px;">${escHtml(label)}</div>` : ''}

        ${deliveryLine(p) ? `<div class="sub" style="font-size:12px;margin-top:4px;color:var(--accent2);font-weight:600;">📅 Livraison prévue : ${deliveryLine(p)}</div>` : ''}
      </div>
      <span class="badge ${p.status}">${STATUS_LABEL[p.status]||p.status}</span>
    </div>
    ${courierStripHTML(p)}
    ${hist ? `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">${hist}</div>` : ''}
    ${p.photoCount > 0 ? `<div class="photosWrap" data-photos-wrap-for="${escHtml(p.trackingId)}" style="margin-top:10px;"><button type="button" data-photos-for="${escHtml(p.trackingId)}" style="width:100%;background:rgba(255,122,26,0.12);border:1px solid var(--accent);color:var(--accent2);border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;">📷 Voir les photos de mon colis (${p.photoCount})</button><div class="photosBox" style="display:none;"></div></div>` : ''}

async function confirmPickup(trackingId){
  // Déclenché immédiatement pour rester lié au geste de l'utilisateur (sinon le son est bloqué par le téléphone)
  triggerConfetti();
  try{
    const pkg = await getPackage(trackingId);
    if(!pkg) return;
    const history = pkg.history || [];
    history.push({status:'livre', date:new Date().toISOString()});
    await savePackage({...pkg, status:'livre', updatedAt:new Date().toISOString(), history, pickedUpAt:new Date().toISOString()});
    toast("Merci ! Bonne réception 🎉");
    renderClient();
  }catch(e){ toast("Erreur, réessayez"); }
}

// Numéro de chaque colis d'un même client : le numéro saisi à la main est prioritaire,
// les autres prennent les plus petits numéros libres (dans l'ordre de création).
function assignColisNumbers(arr){
  const sorted = arr.slice().sort((a, b) => pkgCreatedAt(a) - pkgCreatedAt(b));
  const used = new Set();
  sorted.forEach(p => { const n = parseInt(p.colisNum); if(n >= 1) used.add(n); });
  let counter = 1;
  const res = sorted.map(p => {
    const n = parseInt(p.colisNum);
    if(n >= 1) return {p, num: n, manual: true};
    while(used.has(counter)) counter++;
    used.add(counter);
    return {p, num: counter, manual: false};
  });
  res.sort((a, b) => a.num - b.num);
  return res;
}
// Regroupe les colis par client (même téléphone), classés par numéro de colis.
function groupPackagesByClient(pkgs){
  const byPhone = {};
  (pkgs || []).forEach(p => { (byPhone[p.phone] = byPhone[p.phone] || []).push(p); });
  const groups = Object.values(byPhone).map(arr => assignColisNumbers(arr).map(x => x.p));
  const lastUpdate = arr => Math.max(...arr.map(x => new Date(x.updatedAt || 0).getTime()));
  groups.sort((a, b) => lastUpdate(b) - lastUpdate(a));
  return groups;
}
// { trackingId: {num, total, manual} }
function packageNumbers(pkgs){
  const byPhone = {};
  (pkgs || []).forEach(p => { const k = p.phone + '|' + (p.companyCode || ''); (byPhone[k] = byPhone[k] || []).push(p); });
  const m = {};
  Object.values(byPhone).forEach(arr => assignColisNumbers(arr).forEach(x => { m[x.p.trackingId] = {num: x.num, total: arr.length, manual: x.manual}; }));
  return m;
}
function colisLabel(n){
  return (n && (n.total >= 2 || n.manual)) ? ('Colis #' + n.num) : '';
}

// Si le numéro de suivi saisi existe déjà POUR LE MÊME CLIENT, on crée « NUMERO-#N » (N = numéro du colis).
// Étiquette courte de l'entreprise (initiales) pour rendre un numéro de suivi unique
function companyTag(name){
  const words = String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
  const tag = words.map(w => w[0]).join('').slice(0, 3);
  return tag || 'ENT';
}
// Si le numéro appartient à une autre entreprise, on garde le même numéro + l'étiquette de l'entreprise
async function resolveCrossCompany(trackingId, companyCode, companyName){
  const oc = await getOwnerCode();
  const first = await getPackage(trackingId);
  if(!first || (first.companyCode || oc) === companyCode) return {id: trackingId, renamed: false};
  const tag = companyTag(companyName);
  let cand = trackingId + '-' + tag, n = 2;
  for(let i = 0; i < 20; i++){
    const c = await getPackage(cand);
    if(!c || (c.companyCode || oc) === companyCode) return {id: cand, renamed: true};
    cand = trackingId + '-' + tag + n; n++;
  }
  return {id: cand, renamed: true};
}

function resolveNewTracking(base, phoneN, colisNumRaw){
  const existing = (adminPkgsCache || []).find(p => p.trackingId === base);
  if(!existing) return {id: base, colisNum: colisNumRaw || null, derived: false, conflict: false};
  if(existing.phone !== phoneN) return {id: base, colisNum: colisNumRaw || null, derived: false, conflict: true};
  const others = (adminPkgsCache || []).filter(p => p.phone === phoneN);
  const nums = assignColisNumbers(others).map(x => x.num);
  const n = colisNumRaw || (Math.max(...nums) + 1);
  const root = base.replace(/-#\d+$/, '');
  return {id: root + '-#' + n, colisNum: n, derived: true, conflict: false};
}
// Côté client : retrouve tous les colis d'un même numéro de base (STS-1, STS-1-#2, STS-1-#3...)
async function getTrackingFamily(pkg){
  const root = pkg.trackingId.replace(/-#\d+$/, '');
  const ids = [root];
  for(let n = 2; n <= 8; n++) ids.push(root + '-#' + n);
  const found = await Promise.all(ids.map(id => id === pkg.trackingId ? Promise.resolve(pkg) : getPackage(id).catch(() => null)));
  const list = [];
  found.forEach((p, i) => { if(p) list.push({p, num: i + 1}); });
  if(list.length === 0) list.push({p: pkg, num: 1});
  return list;
}

const MAX_PHOTOS = 6;
let photoUploadTarget = null;

function compressPhoto(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 1100;
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = h * (maxSize / w); w = maxSize; } }
        else { if(h > maxSize){ w = w * (maxSize / h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        let out = canvas.toDataURL('image/jpeg', 0.7);
        if(out.length > 900000) out = canvas.toDataURL('image/jpeg', 0.5);
        if(out.length > 950000) reject(new Error('Photo trop lourde'));
        else resolve(out);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function getPackagePhotos(trackingId){

async function uploadPackagePhotos(trackingId, files){
  const fresh = await getPackage(trackingId);
  let count = (fresh && fresh.photoCount) || 0;
  let added = 0;
  for(const f of files){
    if(count >= MAX_PHOTOS){ toast('Maximum ' + MAX_PHOTOS + ' photos par colis'); break; }
    if(!/^image\//.test(f.type)) continue;
    try{
      toast('📷 Envoi de la photo...');
      const dataUrl = await compressPhoto(f);
      await db.collection('packagePhotos').add({trackingId: trackingId, dataUrl: dataUrl, createdAt: new Date().toISOString()});
      count++; added++;
      await db.collection('packages').doc(trackingId).set({photoCount: count, photosUpdatedAt: new Date().toISOString()}, {merge: true});
    }catch(err){
      console.warn('Photo', err);
      toast("Impossible d'enregistrer la photo (règles Firestore ou photo trop lourde)");
      break;
    }
  }
  if(added){
    toast('✅ ' + added + ' photo' + (added > 1 ? 's' : '') + ' ajoutée' + (added > 1 ? 's' : ''));
    renderAdmin();
  }
}

// Champ « Numéro du colis » du formulaire (juste au-dessus du téléphone)
function initColisNumField(isEditing){
  const phoneEl = document.getElementById('pPhone');
  const numEl = document.getElementById('pColisNum');
  const hint = document.getElementById('pColisHint');
  if(!phoneEl || !numEl || !hint) return;
  let touched = false;
  let lastAuto = '';
  numEl.addEventListener('input', () => { touched = true; });
  function refresh(){
    const phone = normalizePhone(phoneEl.value);
    const others = (adminPkgsCache || []).filter(p => p.phone === phone && p.trackingId !== editingTrackingId);
    if(!phone || others.length === 0){ hint.textContent = ''; return; }
    const nums = assignColisNumbers(others).map(x => x.num);
    const next = Math.max(...nums) + 1;
    hint.textContent = 'Ce client a déjà ' + others.length + ' colis (' + nums.map(n => '#' + n).join(', ') + '). Numéro suggéré : #' + next;
    if(!isEditing && !touched && (numEl.value === '' || numEl.value === lastAuto)){
      numEl.value = String(next);
      lastAuto = String(next);
    }
  }
  phoneEl.addEventListener('input', refresh);
  if(pendingScrollToForm){
    pendingScrollToForm = false;
    setTimeout(() => {
      const t = document.getElementById('pTrack');
      if(t){
        const card = t.closest('.card') || t;
        window.scrollTo({top: Math.max(0, card.getBoundingClientRect().top + window.scrollY - 150), behavior: 'smooth'});
      }
      if(isEditing && editingTrackingId) toast('✏️ Modification de #' + editingTrackingId);
    }, 250);
  }
  const delEl = document.getElementById('pDeliveryDays');
  if(delEl) delEl.addEventListener('input', updateDeliveryPreview);
  editingDeliveryStored = null;
  const trackEl = document.getElementById('pTrack');
  const tHint = document.getElementById('pTrackHint');
  function refreshTrackHint(){
    if(isEditing || !trackEl || !tHint) return;
    const base = trackEl.value.replace(/\s+/g, '').toUpperCase();
    if(!base){ tHint.textContent = ''; return; }
    const raw = parseInt(numEl.value);
    const r = resolveNewTracking(base, normalizePhone(phoneEl.value), raw >= 1 ? raw : null);
    if(!phoneEl.value.trim() && (r.derived || r.conflict)) tHint.textContent = 'ℹ️ Ce numéro de suivi existe déjà. Entrez le téléphone du client pour continuer.';
    else if(r.derived) tHint.textContent = '✅ Ce numéro existe déjà pour ce client : le colis sera enregistré sous ' + r.id;
    else if(r.conflict) tHint.textContent = '⚠️ Ce numéro de suivi appartient à un autre client.';
    else tHint.textContent = '';
  }
  [trackEl, phoneEl, numEl].forEach(el => { if(el) el.addEventListener('input', refreshTrackHint); });
  if(pendingNewColis){
    const pn = pendingNewColis;
    pendingNewColis = null;
    document.getElementById('pName').value = pn.name || '';
    phoneEl.value = pn.phone || '';
    initLocationFields(pn.destCountry || '', pn.destDepartment || '', pn.destCommune || '');
    refresh();
    setTimeout(() => {
      const t = document.getElementById('pTrack');
      if(t){ t.scrollIntoView({behavior: 'smooth', block: 'center'}); t.focus(); }
      toast('Nouveau colis : entrez le nouveau numéro de suivi');

}
async function setPackageDeletedByCompany(trackingId){
  try{
    const d = await db.collection('packages').doc(trackingId).get();
    const p = d.exists ? d.data() : null;
    if(p) await logActivity(p.companyCode || await getOwnerCode(), '🗑️', 'Colis retiré par l\'entreprise', '#' + p.trackingId + ' — ' + (p.name || '') + (p.phone ? ' · ' + p.phone : ''), p.trackingId);
  }catch(e){}
  await db.collection('packages').doc(trackingId).set({deletedByCompany: true, deletedByCompanyAt: new Date().toISOString()}, {merge: true});
}
// Propriétaire : suppression définitive. Entreprise : retire de sa liste (STS garde l'historique).
async function removePackagesByRole(ids){
  if(adminSession && adminSession.isOwner) await Promise.all(ids.map(id => deletePackage(id)));
  else await Promise.all(ids.map(id => setPackageDeletedByCompany(id)));
}
async function setPackageHidden(trackingId, hidden){
  if(hidden){
    try{
      const d = await db.collection('packages').doc(trackingId).get();
      const p = d.exists ? d.data() : null;
      if(p) await logActivity(p.companyCode || await getOwnerCode(), '🗑️', 'Colis supprimé par le client', '#' + p.trackingId + ' — ' + (p.name || '') + (p.phone ? ' · ' + p.phone : ''), p.trackingId);
    }catch(e){}
  }
  await db.collection('packages').doc(trackingId).set(
    hidden ? {hiddenByClient: true, hiddenByClientAt: new Date().toISOString()}
           : {hiddenByClient: false, hiddenByClientAt: null},
    {merge: true}
  );
}
function trackingWhatsappUrl(p, label){
  let digits = String(p.phone || '').replace(/\D/g, '');
  if(digits.length === 8) digits = '509' + digits;
  const lang = getRelanceLang();
  const name = p.name || '';
  const text = lang === 'ht'
    ? `Bonjou ${name}, men nimewo swivi kolis ou a${label ? ' (' + label.replace('Colis', 'Kolis') + ')' : ''} : ${p.trackingId}. Ou ka swiv li sou : ${APP_PUBLIC_URL}`
    : `Bonjour ${name}, voici le numéro de suivi de votre colis${label ? ' (' + label + ')' : ''} : ${p.trackingId}. Vous pouvez le suivre ici : ${APP_PUBLIC_URL}`;
  return 'https://wa.me/' + digits + '?text=' + encodeURIComponent(text);
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString('fr-FR', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
}

    list.innerHTML = `<div class="empty">Aucun colis enregistré pour le moment.</div>`;

  const byId = {};

// Envoyer le numéro de suivi par email (pour un client qui n'a pas WhatsApp)
async function openTrackingEmailModal(p){
  const old = document.getElementById('trackMailModal'); if(old) old.remove();
  let prefill = '';
  try{
    const alertSub = await getTrackingAlert(p.trackingId);
    const client = await getClient(p.phone);
    prefill = (alertSub && alertSub.email) || (client && client.email) || '';
  }catch(e){}
  const overlay = document.createElement('div');
  overlay.id = 'trackMailModal';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:210;display:flex;align-items:center;justify-content:center;padding:16px;';
  overlay.innerHTML = `
    <div style="width:100%;max-width:420px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:18px;">
      <h2 style="margin:0 0 6px;">📧 Envoyer par email</h2>
      <p class="sub" style="margin:0 0 12px;">Le numéro de suivi <b>#${escHtml(p.trackingId)}</b> sera envoyé à ${escHtml(p.name)}. Il recevra aussi un email à chaque changement de statut.</p>
      <label>Email du client</label>
      <input id="trackMailInput" type="email" placeholder="client@email.com" value="${escHtml(prefill)}">
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button class="ghost" id="trackMailCancel" style="flex:1;">Annuler</button>
        <button class="primary" id="trackMailSend" style="flex:2;">Envoyer</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.onclick = (e)=>{ if(e.target === overlay) close(); };
  document.getElementById('trackMailCancel').onclick = close;
  document.getElementById('trackMailSend').onclick = async ()=>{
    const email = document.getElementById('trackMailInput').value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast("Adresse email invalide"); return; }
    if(!emailjsReady && !appsScriptReady){ toast("L'envoi d'email n'est pas configuré"); return; }
    const btn = document.getElementById('trackMailSend');
    btn.disabled = true; btn.textContent = 'Envoi...';
    try{
      await saveTrackingAlert(p.trackingId, email);
      await sendStatusEmail(p);
      toast("📧 Email envoyé à " + email);
      close();
    }catch(e){
      toast("Erreur, réessayez");
      btn.disabled = false; btn.textContent = 'Envoyer';
    }
  };
}

let delClientOpen = false;
function bindDelClientCard(wrap){

  if(!head) return;
  head.onclick = ()=>{
    const body = wrap.querySelector('[data-delcl-body]');

    body.style.display = delClientOpen ? 'block' : 'none';
    head.querySelector('[data-delcl-arrow]').textContent = delClientOpen ? '▼' : '▶';
  };
}
function renderDeletedByClientCard(pkgs){
  const wrap = document.getElementById('deletedByClientWrap');
  if(!wrap) return;
  const hidden = (pkgs || []).filter(p => p.hiddenByClient);
  const clHead = (n) => `
        <div data-delcl-head style="background:linear-gradient(135deg,#FACC15,#3B82F6);padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;">
          <span style="font-size:22px;">🗑️</span>
          <div style="flex:1;min-width:0;color:#0B1120;font-weight:800;font-size:16px;">Colis supprimés par les clients</div>
          <span style="background:#0B1120;color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:800;">${n}</span>
          <span data-delcl-arrow style="flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#0B1120;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;">${delClientOpen ? '▼' : '▶'}</span>
        </div>`;
  const bodyStyle = `padding:14px 16px;display:${delClientOpen ? 'block' : 'none'};`;
  if(hidden.length === 0){
    wrap.innerHTML = `
      <div class="card" style="padding:0;overflow:hidden;">
        ${clHead(0)}
        <div data-delcl-body style="${bodyStyle}">
          <p class="sub" style="margin:0;">✅ Aucun client n'a supprimé sa liste pour le moment. Quand un client le fera, son nom et ses colis apparaîtront ici.</p>
        </div>
      </div>`;
    bindDelClientCard(wrap);
    return;
  }
  const nums = packageNumbers(pkgs);
  const byPhone = {};
  hidden.forEach(p => { (byPhone[p.phone] = byPhone[p.phone] || []).push(p); });
  const lastDel = arr => Math.max(...arr.map(x => new Date(x.hiddenByClientAt || 0).getTime()));
  const groups = Object.values(byPhone).sort((a, b) => lastDel(b) - lastDel(a));
  groups.forEach(arr => arr.sort((a, b) => pkgCreatedAt(a) - pkgCreatedAt(b)));

  wrap.innerHTML = `
    <div class="card" style="padding:0;overflow:hidden;">
      ${clHead(hidden.length)}
      <div data-delcl-body style="${bodyStyle}">
        <p class="sub" style="margin:0 0 12px;">${groups.length} client${groups.length > 1 ? 's ont' : ' a'} supprimé sa liste. Les colis restent dans ton historique.</p>

          </div>`;
        }).join('')}
      </div>
    </div>`;

  bindDelClientCard(wrap);
  wrap.querySelectorAll('[data-restore]').forEach(b => {
    b.onclick = async () => {
      const arr = groups[parseInt(b.dataset.restore)];
      b.disabled = true;
      try{
        await Promise.all(arr.map(p => setPackageHidden(p.trackingId, false)));

        renderAdmin();
      }catch(e){ toast('Erreur, réessayez'); b.disabled = false; }
    };
  });
}

async function renderRelanceCard(pkgs){
  const wrap = document.getElementById('relanceCardWrap');
  if(!wrap) return;
  try{
    const available = (pkgs || []).filter(p => p.status === 'disponible');
    const emails = await Promise.all(available.map(hasRelanceEmail));

    wrap.innerHTML = `
      <div class="card" style="padding:0;overflow:hidden;">
        <div style="background:linear-gradient(135deg,#EC4899,#F97316);padding:14px 16px;display:flex;align-items:center;gap:10px;">
          <span style="font-size:22px;">⏰</span>
          <div style="color:#fff;font-weight:700;font-size:16px;">Colis à relancer</div>
        </div>
        <div style="padding:14px 16px;">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
            <span class="sub" style="margin:0;">Relancer après</span>
            <input id="relanceDays" type="number" min="1" max="365" inputmode="numeric" style="width:76px;margin:0;text-align:center;">
            <span class="sub" style="margin:0;">jours</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
            <button type="button" id="relanceSave"></button>
            <span id="relanceSaveNote" style="font-size:11.5px;color:var(--muted);"></span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
            <span class="sub" style="margin:0;">Message :</span>
            <div class="modeSwitch"><button type="button" id="relLangHt">Kreyòl</button><button type="button" id="relLangFr">Français</button></div>
          </div>
          <div id="relanceList"></div>
        </div>
      </div>`;

    const daysInput = document.getElementById('relanceDays');
    const cfg = await loadRelanceSettings();
    let savedDays = cfg.days;
    let currentDays = savedDays;
    daysInput.value = currentDays;

    function updateSaveUI(){
      const btn = document.getElementById('relanceSave');
      const note = document.getElementById('relanceSaveNote');
      if(currentDays === savedDays){
        btn.textContent = '✅ Sauvegardé';
        btn.style.cssText = 'background:transparent;border:1px solid rgba(62,207,142,0.5);color:var(--ok);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:default;';
        note.textContent = 'Enregistré sur tous vos appareils';
      } else {
        btn.textContent = '💾 Sauvegarder';
        btn.style.cssText = 'background:linear-gradient(135deg,#EC4899,#F97316);border:none;color:#fff;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(249,115,22,0.35);';
        note.textContent = 'Modifié — appuyez sur Sauvegarder';
      }
    }

    function drawList(){
      const n = currentDays;
      const lang = getRelanceLang();
      document.getElementById('relLangHt').classList.toggle('active', lang === 'ht');
      document.getElementById('relLangFr').classList.toggle('active', lang === 'fr');
      const now = Date.now();
      const rows = available.map((p, i) => {
        const since = availableSince(p);
        const d = Math.max(0, Math.floor((now - since.getTime()) / 86400000));
        return {p, d, since, email: emails[i]};
      }).filter(r => r.d >= n).sort((a, b) => b.d - a.d);

      const list = document.getElementById('relanceList');
      const summary = `<p class="sub" style="margin:0 0 12px;">${available.length} colis disponible${available.length > 1 ? 's' : ''} au bureau — <b style="color:var(--text);">${rows.length} à relancer</b></p>`;
      if(rows.length === 0){
        list.innerHTML = summary + `<div class="empty" style="padding:18px 10px;">✅ Aucun colis à relancer pour le moment.</div>`;
        return;
      }
      list.innerHTML = summary + rows.map((r, i) => {
        const urgent = r.d >= n * 2;
        const color = urgent ? '#EF5D5D' : '#F5B93D';
        const bg = urgent ? 'rgba(239,93,93,0.10)' : 'rgba(245,185,61,0.10)';
        const dateTxt = r.since.toLocaleDateString('fr-FR', {day:'2-digit', month:'short'});
        return `
        <div style="background:${bg};border-left:4px solid ${color};border-radius:10px;padding:12px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
            <div>
              <div style="font-weight:700;font-size:14px;">#${escHtml(r.p.trackingId)}</div>
              <div class="name" style="color:var(--muted);font-size:12px;">${escHtml(r.p.name)} · ${escHtml(r.p.phone)}</div>
            </div>
            <span style="background:${color};color:#0B1120;font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap;">${r.d} jour${r.d > 1 ? 's' : ''}</span>
          </div>
          <div class="sub" style="margin:6px 0 10px;font-size:11.5px;">Disponible au bureau depuis le ${dateTxt}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button type="button" class="miniBtn" style="color:#25D366;border-color:rgba(37,211,102,0.5);" data-wa="${i}">💬 Relancer (WhatsApp)</button>
            ${r.email ? `<button type="button" class="miniBtn" style="color:var(--info);border-color:rgba(96,165,250,0.5);" data-mail="${i}">📧 Email</button>` : ''}
          </div>
        </div>`;
      }).join('');

      list.querySelectorAll('[data-wa]').forEach(b => {
        b.onclick = () => {
          const r = rows[parseInt(b.dataset.wa)];
          window.open(relanceWhatsappUrl(r.p, r.d, getRelanceLang()), '_blank');
        };
      });
      list.querySelectorAll('[data-mail]').forEach(b => {
        b.onclick = async () => {
          const r = rows[parseInt(b.dataset.mail)];
          b.disabled = true;
          try{ await sendStatusEmail(r.p); toast('📧 Email de rappel envoyé'); }
          catch(e){ toast("Erreur d'envoi de l'email"); }
          b.disabled = false;
        };
      });
    }

    daysInput.oninput = () => {
      const n = parseInt(daysInput.value);
      if(n >= 1 && n <= 365){
        currentDays = n;
        updateSaveUI();
        drawList();
      }
    };
    document.getElementById('relanceSave').onclick = async () => {
      if(currentDays === savedDays){ toast('✅ Déjà sauvegardé : relance après ' + savedDays + ' jour' + (savedDays > 1 ? 's' : '')); return; }
      const btn = document.getElementById('relanceSave');
      btn.disabled = true;
      try{ localStorage.setItem(RELANCE_DAYS_KEY, String(currentDays)); }catch(e){}
      const ok = await saveRelanceCloud({days: currentDays, lang: getRelanceLang()});
      btn.disabled = false;
      savedDays = currentDays;
      updateSaveUI();
      const label = 'relance après ' + savedDays + ' jour' + (savedDays > 1 ? 's' : '');
      if(ok){ toast('✅ Enregistré pour tous vos appareils : ' + label); }
      else {
        document.getElementById('relanceSaveNote').textContent = 'Enregistré sur ce téléphone seulement (pas de connexion)';
        toast('⚠️ Enregistré seulement sur ce téléphone : ' + label);
      }
    };
    document.getElementById('relLangHt').onclick = () => { try{ localStorage.setItem(RELANCE_LANG_KEY, 'ht'); }catch(e){} saveRelanceCloud({lang:'ht'}); drawList(); };
    document.getElementById('relLangFr').onclick = () => { try{ localStorage.setItem(RELANCE_LANG_KEY, 'fr'); }catch(e){} saveRelanceCloud({lang:'fr'}); drawList(); };
    updateSaveUI();
    drawList();
  }catch(e){
    console.warn('Carte relance', e);
    wrap.innerHTML = `<div class="card"><div class="empty" style="padding:18px 10px;">⚠️ Impossible d'afficher les colis à relancer pour le moment.</div></div>`;
  }
}

function waPhone(phone){
  let d = String(phone || '').replace(/\D/g, '');
  if(d.length === 8) d = '509' + d;
  return d;
}
function waChatBtn(phone, text){

}
const delCoOpen = new Set();
async function deletedByCompaniesHTML(companies){
  const arrowBox = (open) => `<span data-arrow-ico style="flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#0B1120;color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;">${open ? '▼' : '▶'}</span>`;

    const all = await getAllPackages();
    const del = all.filter(p => p.deletedByCompany && p.companyCode && names[p.companyCode]);
    const byCo = {};
    del.forEach(p => { (byCo[p.companyCode] = byCo[p.companyCode] || []).push(p); });
    const list = (companies || []).slice().sort((x, y) => ((byCo[y.code] || []).length - (byCo[x.code] || []).length) || String(x.companyName).localeCompare(String(y.companyName)));
    const rootOpen = delCoOpen.has('root');
    const rows = list.map(c => {
      const arr = (byCo[c.code] || []).slice().sort((p, q) => new Date(q.deletedByCompanyAt || 0) - new Date(p.deletedByCompanyAt || 0));
      const open = delCoOpen.has(c.code);
      const inner = arr.length ? arr.map(p => `
          <div style="padding:10px 12px;margin-top:8px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,0.03);">
            <div style="font-weight:700;">👤 ${escHtml(p.name || '—')} <span class="sub" style="font-weight:400;">· ${escHtml(p.phone || '')}</span></div>
            <div style="font-size:13px;margin-top:2px;">#${escHtml(p.trackingId)} — ${STATUS_LABEL[p.status] || p.status}</div>
            <div class="sub" style="font-size:11px;margin-top:3px;">Supprimé le ${p.deletedByCompanyAt ? fmtDate(p.deletedByCompanyAt) : '—'}</div>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <button type="button" class="miniBtn" style="flex:1;" data-restore-co="${escHtml(p.trackingId)}">↩️ Restaurer</button>
              <button type="button" class="miniBtn" style="flex:1;color:var(--danger);border-color:rgba(239,93,93,0.4);" data-purge-co="${escHtml(p.trackingId)}">🗑️ Supprimer définitivement</button>
            </div>
          </div>`).join('')
        : `<div class="sub" style="margin-top:8px;font-size:12.5px;">✅ Cette entreprise n'a supprimé aucun colis.</div>`;
      return `
        <div style="margin-bottom:10px;border:1px solid var(--border);border-radius:14px;padding:10px 12px;background:rgba(255,255,255,0.02);">
          <div data-delco-head="${escHtml(c.code)}" style="display:flex;align-items:center;gap:10px;cursor:pointer;">
            <span data-delarrow style="color:var(--accent);font-size:18px;font-weight:900;width:16px;text-align:center;">${open ? '▼' : '▶'}</span>
            <span style="flex:1;min-width:0;font-weight:800;overflow-wrap:anywhere;">🏢 ${escHtml(c.companyName)}</span>
            <span style="padding:2px 10px;border-radius:12px;font-size:11.5px;font-weight:800;${arr.length ? 'background:rgba(239,93,93,0.18);color:var(--danger);' : 'background:rgba(255,255,255,0.06);color:var(--muted);'}">${arr.length} colis</span>
          </div>
          <div data-delco-box="${escHtml(c.code)}" style="display:${open ? 'block' : 'none'};">${inner}</div>
        </div>`;
    }).join('');
    return `<div class="card" style="padding:0;overflow:hidden;">
      <div data-delco-root style="background:linear-gradient(135deg,#FACC15,#3B82F6);padding:14px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;">
        <span style="font-size:22px;">🗑️</span>
        <div style="flex:1;min-width:0;color:#0B1120;font-weight:800;font-size:16px;">Colis supprimés par les entreprises</div>
        <span style="background:#0B1120;color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:800;">${del.length}</span>
        ${arrowBox(rootOpen)}
      </div>
      <div data-delco-body style="padding:14px 16px;display:${rootOpen ? 'block' : 'none'};">
        ${list.length ? (del.length ? '' : '<p class="sub" style="margin:0 0 10px;">✅ Aucune entreprise n\'a supprimé de colis pour le moment.</p>') + rows : '<p class="sub" style="margin:0;">Aucune entreprise inscrite.</p>'}
      </div>
    </div>`;
  }catch(e){ return ''; }
}
function bindDeletedByCompanies(root, rerender){
  const rootHead = root.querySelector('[data-delco-root]');
  if(rootHead){
    rootHead.onclick = ()=>{
      const body = root.querySelector('[data-delco-body]');
      const open = body.style.display === 'none';
      body.style.display = open ? 'block' : 'none';
      rootHead.querySelector('[data-arrow-ico]').textContent = open ? '▼' : '▶';
      if(open) delCoOpen.add('root'); else delCoOpen.delete('root');
    };
  }
  root.querySelectorAll('[data-delco-head]').forEach(h => {
    h.onclick = ()=>{
      const code = h.dataset.delcoHead;
      const box = root.querySelector('[data-delco-box="' + code + '"]');
      const open = box.style.display === 'none';
      box.style.display = open ? 'block' : 'none';
      h.querySelector('[data-delarrow]').textContent = open ? '▼' : '▶';
      if(open) delCoOpen.add(code); else delCoOpen.delete(code);
    };
  });
  root.querySelectorAll('[data-restore-co]').forEach(b => {
    b.onclick = async ()=>{
      try{
        await db.collection('packages').doc(b.dataset.restoreCo).set({deletedByCompany: false, deletedByCompanyAt: null}, {merge: true});
        toast('Colis restauré chez l\'entreprise');
        rerender();
      }catch(e){ toast('Erreur, réessayez'); }
    };
  });
  root.querySelectorAll('[data-purge-co]').forEach(b => {
    b.onclick = async ()=>{
      if(!confirm('Supprimer DÉFINITIVEMENT ce colis ?\n\nCette action est irréversible.')) return;
      try{ await deletePackage(b.dataset.purgeCo); toast('Colis supprimé définitivement'); rerender(); }
      catch(e){ toast('Erreur, réessayez'); }
    };
  });
}

              <button class="${c.blocked ? 'primary' : 'miniBtn'}" style="flex:1;${c.blocked ? 'width:auto;padding:8px 14px;font-size:11px;' : ''}" data-toggle="${c.code}" data-blocked="${c.blocked}">

      content.querySelectorAll('[data-payarrow]').forEach(b=>{
        b.onclick = (e)=>{
          e.stopPropagation();
          const sel = content.querySelector('[data-paysel="'+b.dataset.payarrow+'"]');
          sel.style.display = (sel.style.display === 'none') ? 'inline-block' : 'none';
        };
      });
      content.querySelectorAll('[data-paysel]').forEach(sel=>{
        sel.onclick = (e)=> e.stopPropagation();
        sel.onchange = async ()=>{
          const free = sel.value === 'free';
          if(!confirm(free ? ('Rendre « ' + sel.dataset.name + ' » GRATUIT ? Elle ne paiera plus (ni inscription ni abonnement).') : ('Remettre « ' + sel.dataset.name + ' » en PAYANT ?'))){ renderOwnerCompanies(); return; }
          try{
            await setCompanyFree(sel.dataset.paysel, free);
            toast(free ? 'Entreprise gratuite ✅' : 'Entreprise en payant');

          renderOwnerCompanies();

      });
      content.querySelectorAll('[data-delete]').forEach(b=>{
        b.onclick = async (e)=>{
          e.stopPropagation();
          const ok = confirm(`Supprimer définitivement "${b.dataset.name}" ? Cette action est irréversible.`);
          if(!ok) return;
          await deleteCompany(b.dataset.delete);
          toast("Entreprise supprimée");
          renderOwnerCompanies();
        };
      });
      content.querySelectorAll('.info[data-view]').forEach(el=>{
        el.onclick = ()=>{
          const code = el.dataset.view;
          const box = content.querySelector('[data-box="' + code + '"]');
          const wasOpen = !!(box && box.innerHTML.trim() !== '');
          content.querySelectorAll('[data-box]').forEach(b => { b.innerHTML = ''; });
          content.querySelectorAll('[data-arrow]').forEach(a => { a.textContent = '▶'; });
          if(wasOpen) return;
          const arrow = el.querySelector('[data-arrow]');
          if(arrow) arrow.textContent = '▼';
          renderCompanyPackagesView(code, el.dataset.name);
        };
      });
      markCompaniesSeen();
    }
    bindSupportRequests(content, renderOwnerCompanies);
    bindActivityLog(content, renderOwnerCompanies);
    bindDeletedByCompanies(content, renderOwnerCompanies);
  }catch(e){
    content.innerHTML = `<div class="card"><div class="empty">Impossible de charger les entreprises.</div></div>`;
  }
}

async function renderCompanyPackagesView(code, companyName){
  const view = document.querySelector('[data-box="' + code + '"]') || document.getElementById('companyPkgView');
  view.innerHTML = `<div class="card" style="margin-top:12px;"><div class="empty">Chargement...</div></div>`;
  try{
    const pkgs = await getCompanyPackages(code);
    if(pkgs.length===0){
      view.innerHTML = `<div class="card"><h2>Colis — ${companyName}</h2><div class="empty">Aucun colis pour cette entreprise.</div></div>`;
    } else {
      view.innerHTML = `<div class="card"><h2>Colis — ${companyName}</h2>` + pkgs.map(p=>`
        <div class="pkgAdmin" style="align-items:center;gap:10px;">
          <div class="info" style="flex:1;">
            <div><b>#${p.trackingId}</b> — ${STATUS_LABEL[p.status]||p.status}</div>
            <div style="font-size:14px;font-weight:700;margin-top:2px;">👤 ${escHtml(p.name||'—')} <span class="name" style="font-weight:400;">· ${escHtml(p.phone||'')}</span></div>
            <div class="pkgPhotos" data-pkgphotos-for="${escHtml(p.trackingId)}" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;"><span class="sub" style="font-size:11px;">📷 ${p.photoCount ? 'Chargement des photos...' : 'Aucune photo'}</span></div>
            ${(p.destCommune||p.destDepartment) ? `<div class="sub" style="font-size:11px;">📍 ${[p.destCommune,p.destDepartment,p.destCountry].filter(Boolean).join(', ')}</div>` : ''}
          </div>
          <button class="miniBtn" style="color:var(--danger);border-color:rgba(239,93,93,0.4);flex-shrink:0;" data-delpkg="${p.trackingId}">Supprimer</button>
        </div>`).join('') + `</div>`;
      view.querySelectorAll("[data-pkgphotos-for]").forEach(async box=>{
        const id = box.dataset.pkgphotosFor;
        const pk = pkgs.find(x=>String(x.trackingId)===id);
        if(!pk || !pk.photoCount) return;
        try{
          const photos = await getPackagePhotos(id);
          box.innerHTML = photos.length
            ? photos.map(ph=>`<img src="${ph.dataUrl}" data-zoom="${ph.dataUrl}" style="width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;border:1px solid var(--border);">`).join('')
            : '<span class="sub" style="font-size:11px;">📷 Aucune photo</span>';
        }catch(e){ box.innerHTML = '<span class="sub" style="font-size:11px;">📷 Photos indisponibles</span>'; }
      });
      view.querySelectorAll('[data-delpkg]').forEach(b=>{
        b.onclick = async ()=>{
          const id = b.dataset.delpkg;
          if(!confirm('Supprimer définitivement le colis #' + id + ' ? Cette action est irréversible.')) return;
          try{
            await deletePackage(id);
            toast("Colis supprimé");
            renderCompanyPackagesView(code, companyName);
          }catch(e){ toast("Erreur, réessayez"); }
        };
      });
    }
  }catch(e){
    view.innerHTML = `<div class="card"><div class="empty">Impossible de charger les colis.</div></div>`;
  }
}

async function renderOwnerPackages(){
  const content = document.getElementById('ownerContent');
  const optionsHtml = STATUSES.map(s=>`<option value="${s.key}">${s.label}</option>`).join('');
  const isEditing = !!editingTrackingId;
  content.innerHTML = `
    <div class="card">
      <h2>${isEditing ? 'Modifier le colis' : 'Ajouter un colis'}</h2>
      ${isEditing ? `<div class="editingBanner"><span>Modification de #${editingTrackingId}</span><button class="ghost" id="btnCancelEdit">Annuler</button></div>` : ''}
      <label>Numéro de suivi</label>
      <input id="pTrack" placeholder="Ex : STS-2026-001" ${isEditing ? 'disabled' : ''}>
      <div id="pTrackHint" style="font-size:11.5px;color:var(--accent2);margin:-6px 0 12px;"></div>
      <label>Nom du client</label>
      <input id="pName" placeholder="Ex : Marie Dupont">
      <label>Numéro du colis de ce client <span style="color:var(--muted);font-weight:400;">(facultatif : 1, 2, 3...)</span></label>
      <input id="pColisNum" type="number" min="1" inputmode="numeric" placeholder="Ex : 2 pour « Colis #2 »">
      <div id="pColisHint" style="font-size:11.5px;color:var(--accent2);margin:-6px 0 12px;"></div>
      <label>Téléphone du client</label>
      <input id="pPhone" type="tel" placeholder="Ex : 06 12 34 56 78">
      ${buildLocationSelectsHTML()}
      <label>Statut</label>
      <select id="pStatus">${optionsHtml}</select>
      <label>Livraison prévue dans (jours) <span style="color:var(--muted);font-weight:400;">(facultatif)</span></label>
      <input id="pDeliveryDays" type="number" min="1" max="365" inputmode="numeric" placeholder="Ex : 4">
      <div id="pDeliveryPreview" style="font-size:12px;color:var(--accent2);margin:-6px 0 12px;"></div>
      <button class="primary" id="btnSavePkg">${isEditing ? 'Mettre à jour le colis' : 'Enregistrer le colis'}</button>
    </div>
    <div class="card">
      <h2>📊 Suivi par destination</h2>
      <label>Mois</label>
      <select id="monthFilter"></select>
      <label>Filtrer par département</label>
      <select id="destFilter"><option value="">Toutes les destinations</option>${Object.keys(HAITI_LOCATIONS).map(d=>`<option value="${d}">${d}</option>`).join('')}</select>
      <div id="destStats" style="margin-top:14px;"><div class="empty">Chargement...</div></div>
      <div id="destFilterResults" style="margin-top:10px;"></div>
    </div>
    <div id="relanceCardWrap"></div>
    <div id="deletedByClientWrap"></div>
    <div class="card">
      <h2>Tous les colis</h2>
      <input type="search" id="adminSearch" placeholder="🔍 Rechercher un client, un téléphone ou un n° de suivi" value="${escHtml(adminSearchQ)}" style="margin-bottom:12px;">
      <div id="adminList"><div class="empty">Chargement...</div></div>
    </div>`;
  initLocationFields('','','');
  initColisNumField(isEditing);

  if(isEditing){
    try{
      const existing = await getPackage(editingTrackingId);
      if(existing){
        document.getElementById('pTrack').value = existing.trackingId;
        document.getElementById('pName').value = existing.name || '';
        document.getElementById('pPhone').value = existing.phone || '';
        document.getElementById('pStatus').value = existing.status || 'preparation';
        if(document.getElementById('pColisNum')) document.getElementById('pColisNum').value = existing.colisNum || '';
        if(document.getElementById('pDeliveryDays')){
          document.getElementById('pDeliveryDays').value = existing.deliveryDays || '';
          editingDeliveryStored = existing.deliveryDays ? {days: existing.deliveryDays, date: existing.deliveryDate} : null;
          updateDeliveryPreview();
        }
        initLocationFields(existing.destCountry||'', existing.destDepartment||'', existing.destCommune||'');
      }
    }catch(e){}
    document.getElementById('btnCancelEdit').onclick = ()=>{ editingTrackingId = null; renderAdmin(); };
  }

  document.getElementById('btnSavePkg').onclick = async ()=>{
    if(!firebaseReady){ toast("Firebase non configuré"); return; }
    let trackingId = isEditing ? editingTrackingId : document.getElementById('pTrack').value.replace(/\s+/g,'').toUpperCase();
    const name = document.getElementById('pName').value.trim();
    const phone = document.getElementById('pPhone').value.trim();
    const status = document.getElementById('pStatus').value;
    const destCountry = getDestCountryValue();
    if(destCountry === null){ toast("Écrivez le nom du pays"); return; }
    const destDepartment = document.getElementById('pDept') ? document.getElementById('pDept').value : '';
    const destCommune = document.getElementById('pCommune') ? document.getElementById('pCommune').value : '';
    if(!trackingId || !phone || !name){ toast("Nom, numéro de suivi et téléphone requis"); return; }
    const colisNumRaw = parseInt((document.getElementById('pColisNum') || {}).value);
    let colisNum = colisNumRaw >= 1 ? colisNumRaw : null;
    let derivedId = false;
    const deliveryRaw = parseInt((document.getElementById('pDeliveryDays') || {}).value);
    const deliveryDays = (deliveryRaw >= 1 && deliveryRaw <= 365) ? deliveryRaw : null;
    if(!isEditing){
      const r = resolveNewTracking(trackingId, normalizePhone(phone), colisNum);
      if(r.derived){ trackingId = r.id; colisNum = r.colisNum; derivedId = true; }
    }
    if(colisNum){
      const phoneN = normalizePhone(phone);
      const others = (adminPkgsCache || []).filter(p => p.phone === phoneN && p.trackingId !== trackingId);
      const taken = assignColisNumbers(others).find(x => x.num === colisNum);
      if(taken){ toast('Ce client a déjà un Colis #' + colisNum + ' (#' + taken.p.trackingId + '). Choisissez un autre numéro.'); return; }
    }
    try{
      if(!isEditing){
        const cc = await resolveCrossCompany(trackingId, adminSession.code, adminSession.companyName || 'Sam Trace Store');
        if(cc.renamed){ trackingId = cc.id; derivedId = true; }
        const dejaPris = await getPackage(trackingId);
        if(dejaPris){
          if(dejaPris.phone === normalizePhone(phone)) toast("Ce colis existe déjà. Pour changer son statut, utilise le menu de statut sur le colis dans « Tous les colis ».");
          else toast("Ce numéro de suivi existe déjà. Choisissez-en un autre.");
          return;
        }
      }
      let history = [];
      let existingPickedUpAt = null;
      let existingHidden = null;
      let existingDelivery = null;
      let existingPhotoMeta = null;
      if(isEditing){
        const existing = await getPackage(trackingId);
        history = (existing && existing.history) ? existing.history : [];
        existingPickedUpAt = (existing && existing.pickedUpAt) ? existing.pickedUpAt : null;
        existingHidden = (existing && existing.hiddenByClient) ? (existing.hiddenByClientAt || true) : null;
        existingDelivery = (existing && existing.deliveryDays) ? {days: existing.deliveryDays, date: existing.deliveryDate} : null;
        existingPhotoMeta = existing ? {photoCount: existing.photoCount, photosViewedAt: existing.photosViewedAt, photosUpdatedAt: existing.photosUpdatedAt} : null;
      }
      const lastStatus = history.length ? history[history.length-1].status : null;
      const statusChanged = status !== lastStatus;
      if(statusChanged){
        history.push({status, date:new Date().toISOString()});
      }
      const pkg = {trackingId, name, phone: normalizePhone(phone), status, destCountry, destDepartment, destCommune, updatedAt:new Date().toISOString(), history, companyCode: adminSession.code};
      if(existingPickedUpAt) pkg.pickedUpAt = existingPickedUpAt;
      if(existingHidden){ pkg.hiddenByClient = true; pkg.hiddenByClientAt = (existingHidden === true) ? null : existingHidden; }
      if(colisNum) pkg.colisNum = colisNum;
      if(deliveryDays){
        pkg.deliveryDays = deliveryDays;
        pkg.deliveryDate = (existingDelivery && existingDelivery.days === deliveryDays && existingDelivery.date) ? existingDelivery.date : dateFromDays(deliveryDays);
      }
      if(existingPhotoMeta){ Object.keys(existingPhotoMeta).forEach(k => { if(existingPhotoMeta[k] !== undefined) pkg[k] = existingPhotoMeta[k]; }); }
      await savePackage(pkg);
      openClientGroups.add(pkg.phone);
      if(statusChanged) sendStatusEmail(pkg);
      toast(isEditing ? "Colis mis à jour" : (derivedId ? ("Colis enregistré sous " + trackingId) : "Colis enregistré"));
      editingTrackingId = null;
      renderAdmin();
    }catch(e){ toast("Erreur d'enregistrement"); }
  };

  try{
    const allPkgsForStats = await getAllPackages();

    const monthOptions = [];
    const now0 = new Date();
    for(let i=0;i<6;i++){
      const d = new Date(now0.getFullYear(), now0.getMonth()-i, 1);
      monthOptions.push({year:d.getFullYear(), month:d.getMonth(), label:d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})});
    }
    const monthSelect = document.getElementById('monthFilter');
    monthSelect.innerHTML = monthOptions.map((m,i)=>`<option value="${i}">${m.label}${i===0?' (en cours)':''}</option>`).join('');

    function renderStatsForMonth(idx){
      const {year, month} = monthOptions[idx];
      const monthPkgs = allPkgsForStats.filter(p=>{
        const d = new Date((p.history&&p.history[0]&&p.history[0].date) || p.updatedAt);
        return d.getFullYear()===year && d.getMonth()===month;
      });
      const counts = {};
      monthPkgs.forEach(p=>{
        const key = p.destDepartment || 'Non renseigné';
        counts[key] = (counts[key]||0) + 1;
      });
      const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
      const maxCount = sorted.length ? sorted[0][1] : 1;
      const statsEl = document.getElementById('destStats');
      if(sorted.length===0){
        statsEl.innerHTML = `<div class="empty">Aucun colis pour ce mois.</div>`;
      } else {
        statsEl.innerHTML = `<p class="sub" style="margin-bottom:8px;">Colis par département</p>` + sorted.map(([dept,count])=>`
          <div style="margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;"><span>${dept}</span><b>${count}</b></div>
            <div style="background:var(--panel2);border-radius:8px;height:8px;overflow:hidden;"><div style="background:linear-gradient(90deg,#0EA5E9,#6366F1);height:100%;width:${Math.round((count/maxCount)*100)}%;"></div></div>
          </div>`).join('');
      }
    }
    renderStatsForMonth(0);
    monthSelect.onchange = ()=> renderStatsForMonth(parseInt(monthSelect.value));

    document.getElementById('destFilter').onchange = async (e)=>{
      const dept = e.target.value;
      const resultsEl = document.getElementById('destFilterResults');
      if(!dept){ resultsEl.innerHTML = ''; return; }
      const matches = allPkgsForStats.filter(p=>p.destDepartment === dept);
      if(matches.length === 0){
        resultsEl.innerHTML = `<div class="empty">Aucun colis pour ${dept}.</div>`;
      } else {
        resultsEl.innerHTML = matches.map(p=>`
          <div class="pkgAdmin" style="flex-direction:column;align-items:stretch;">
            <div><b>#${p.trackingId}</b> — ${STATUS_LABEL[p.status]||p.status}</div>
            <div class="name">${p.name} · ${[p.destCommune,p.destDepartment].filter(Boolean).join(', ')}</div>
          </div>`).join('');
      }
    };
  }catch(e){}

  try{
    const pkgs = await getCompanyPackages(adminSession.code);
    try{ renderDeletedByClientCard(pkgs); }catch(e){ console.warn('Carte suppressions', e); }
    await renderAdminPkgList(pkgs);
    renderRelanceCard(pkgs).catch(e => console.warn('Carte relance', e));
  }catch(e){
    document.getElementById('adminList').innerHTML = `<div class="empty">Impossible de charger les colis.</div>`;
  }
}

function validateProofFile(file){
  if(!['image/jpeg','image/png'].includes(file.type)){
    return "Format non supporté. Veuillez choisir une image au format JPG ou PNG.";
  }
  if(file.size > 5*1024*1024){
    return "Cette photo est trop lourde. La taille maximale autorisée est de 5 Mo.";
  }
  return null;
}

  if(status === 'pending'){
    main.innerHTML = `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
        <div><p class="sub" style="margin:0">Connecté en tant que</p><b>${adminSession.companyName||'Admin'}</b></div>

        <p class="sub" style="margin:0;">Montant déclaré : ${company.depositAmount} ${company.depositCurrency} via ${company.depositMethod}</p>
      </div>

    document.getElementById('btnRetryDeposit').onclick = ()=>{ renderPaymentGate(main, company, 'none'); };
    markPaymentNotified(adminSession.code);
    return;

  // status === 'none'
  const methodCards = PAYMENT_METHODS.map(m=>{
    const icon = settings.icons[`${m.key}_icon`];

    return `
