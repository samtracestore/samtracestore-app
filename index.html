<style>
  :root{
    --bg:#0B1120; --panel:#111827; --panel2:#1A2333;
    --accent:#FF7A1A; --accent2:#FFB067; --text:#F4F6FA; --muted:#8B95A8;
    --border:#232E44; --ok:#3ECF8E; --warn:#F5B93D; --info:#60A5FA; --danger:#EF5D5D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,#0B1120 0%,#0D1420 100%);}
  header.top{padding:22px 20px 16px;display:flex;align-items:center;gap:12px;
    border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(11,17,32,0.92);
    backdrop-filter:blur(8px);z-index:10;}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#FF4D1A);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;
    box-shadow:0 4px 14px rgba(255,122,26,0.35);}
  header.top .titles{flex:1;}
  header.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.2px;}
  header.top p{font-size:11.5px;margin:2px 0 0;color:var(--muted);}
  .modeSwitch{display:flex;gap:6px;background:var(--panel2);padding:4px;border-radius:10px;}
  .modeSwitch button{border:none;background:transparent;color:var(--muted);font-size:12px;
    padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:600;}
  .modeSwitch button.active{background:var(--accent);color:#0B1120;}
  main{flex:1;padding:20px;padding-bottom:100px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;}
  .card h2{font-size:14.5px;margin:0 0 4px;font-weight:700;}
  .card p.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px;line-height:1.5;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);
    border-radius:10px;padding:12px 13px;font-size:14.5px;margin-bottom:12px;outline:none;}
  input:focus,select:focus{border-color:var(--accent);}
  input::placeholder{color:#556077;}
  button.primary{width:100%;background:linear-gradient(135deg,var(--accent),#FF5A1A);color:#fff;
    border:none;border-radius:10px;padding:13px;font-size:14.5px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 16px rgba(255,122,26,0.3);}
  button.primary:active{transform:scale(0.98);}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer;}
  .pkg{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:12px;}
  .pkg .row1{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .pkg .tid{font-weight:700;font-size:14px;}
  .pkg .desc{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap;}
  .badge.preparation{background:rgba(139,149,168,0.18);color:var(--muted);}
  .badge.expedie{background:rgba(96,165,250,0.15);color:var(--info);}
  .badge.attente{background:rgba(245,185,61,0.15);color:var(--warn);}
  .badge.disponible{background:rgba(219,39,119,0.15);color:#EC4899;}
  .badge.livre{background:rgba(62,207,142,0.15);color:var(--ok);}
  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty .big{font-size:36px;margin-bottom:10px;}
  footer.share{position:fixed;bottom:66px;left:0;right:0;max-width:480px;margin:0 auto;
    padding:14px 20px 22px;background:linear-gradient(0deg,var(--bg) 60%,transparent);pointer-events:none;}
  .waBtn{width:100%;background:#25D366;color:#06210F;border:none;border-radius:12px;
    padding:14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
    gap:8px;cursor:pointer;box-shadow:0 6px 18px rgba(37,211,102,0.35);pointer-events:auto;}
  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1A2333;
    border:1px solid var(--border);padding:10px 18px;border-radius:10px;font-size:13px;
    opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:50;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:200;display:none;
    align-items:center;justify-content:center;padding:20px;}
  .lightbox.show{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:8px;}
  .lightbox .closeBtn{position:absolute;top:20px;right:20px;background:rgba(255,255,255,0.15);
    color:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer;}
  .compactCard{background:var(--panel);border:1px solid var(--border);border-radius:16px;
    overflow:hidden;margin-bottom:14px;cursor:pointer;}
  .compactBanner{height:64px;display:flex;align-items:center;justify-content:center;}
  .compactIcon{font-size:26px;}
  .compactBody{padding:12px 16px;}
  .compactTitle{font-weight:700;font-size:14px;}
  .compactSub{color:var(--muted);font-size:12px;margin-top:2px;}
  .pkgAdmin{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);
    border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .pkgAdmin .info{font-size:13px;}
  .pkgAdmin .info .name{color:var(--muted);font-size:11.5px;}
  .miniBtn{background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;}
  .warnBox{background:rgba(245,185,61,0.1);border:1px solid rgba(245,185,61,0.3);color:var(--warn);
    border-radius:10px;padding:12px;font-size:12px;line-height:1.5;margin-bottom:14px;}
  .histline{display:flex;gap:10px;font-size:12px;color:var(--muted);padding:4px 0;}
  .histline .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:5px;flex-shrink:0;}
  .editBtn{background:rgba(255,122,26,0.15);border:1px solid var(--accent);color:var(--accent);
    border-radius:8px;padding:6px 10px;font-size:11px;cursor:pointer;margin-right:6px;}
  .editingBanner{background:rgba(255,122,26,0.12);border:1px solid var(--accent);color:var(--accent2);
    border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;display:flex;
    justify-content:space-between;align-items:center;}
  .pickupBtn{width:100%;margin-top:12px;background:linear-gradient(135deg,#EC4899,#BE185D);color:#fff;
    border:none;border-radius:10px;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;}
  .confettiPiece{position:fixed;top:-40px;font-size:22px;z-index:999;pointer-events:none;
    animation:confettiFall linear forwards;}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(110vh) rotate(360deg);opacity:0.9;}
  }
</style>
</head>

let emailjsReady = false;
try{
  if(EMAILJS_PUBLIC_KEY !== "VOTRE_PUBLIC_KEY"){

// ==================================================================

// par /exec). Utilisé automatiquement seulement si EmailJS échoue
// (ex: quota de 200 emails/mois dépassé).

const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3I7fB6HuuvTUtBYLM8gKjlxiEH1Bx_uKsRGtOyJXTbILT9a_fkUuarFlXdXFpI4be/exec";
const appsScriptReady = APPS_SCRIPT_URL !== "VOTRE_APPS_SCRIPT_URL";

async function sendViaAppsScript(pkg, client){
  if(!appsScriptReady) return;
  await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain'},
    body: JSON.stringify({
      to_email: client.email,
      name: client.name || pkg.name || '',
      message: buildStatusMessage(pkg),
      email: client.email,
      company_name: adminSession && adminSession.companyName ? adminSession.companyName : 'Sam Trace Store'
    })
  });
  incrementGoogleScriptQuota();
}

function buildStatusMessage(pkg){
  const statusMsg = STATUS_EMAIL_MESSAGE[pkg.status] || '';
  const statusLabel = STATUS_LABEL[pkg.status] || pkg.status;
  return `${statusMsg}\n\nNuméro de suivi : ${pkg.trackingId}\nStatut actuel : ${statusLabel}`;
}

async function sendStatusEmail(pkg){
  if(!emailjsReady && !appsScriptReady) return;
  const recipients = [];
  const client = await getClient(pkg.phone);
  if(client && client.email) recipients.push({email: client.email, name: client.name || pkg.name || ''});
  const alertSub = await getTrackingAlert(pkg.trackingId);
  if(alertSub && alertSub.email && !recipients.some(r=> r.email.toLowerCase() === alertSub.email.toLowerCase())){
    recipients.push({email: alertSub.email, name: pkg.name || ''});
  }
  for(const r of recipients){
    let emailjsFailed = false;
    if(emailjsReady){
      try{
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: r.email,
          name: r.name,
          message: buildStatusMessage(pkg),
          email: r.email,
          company_name: adminSession && adminSession.companyName ? adminSession.companyName : 'Sam Trace Store'
        });
        incrementEmailQuota();
      }catch(e){
        console.warn('EmailJS a échoué, tentative via Google Apps Script', e);
        emailjsFailed = true;
      }
    }
    if((!emailjsReady || emailjsFailed) && appsScriptReady){
      try{ await sendViaAppsScript(pkg, {email: r.email, name: r.name}); }
      catch(e){ console.warn('Google Apps Script a échoué aussi', e); }
    }
  }
}

async function saveTrackingAlert(trackingId, email){
  await db.collection('trackingAlerts').doc(trackingId).set({email, createdAt:new Date().toISOString()});
}

async function getTrackingAlert(trackingId){
  try{
    const doc = await db.collection('trackingAlerts').doc(trackingId).get();
    return doc.exists ? doc.data() : null;
  }catch(e){ return null; }
}

function first4(phone){
  let p = normalizePhone(phone);
  if(p.startsWith('+509')) p = p.slice(4);
  else if(p.startsWith('509')) p = p.slice(3);
  else if(p.startsWith('00509')) p = p.slice(5);

const LOGIN_LOCKOUT_LS_KEY = 'sts_login_lockout';
const MAX_LOGIN_ATTEMPTS = 5;
const LOCKOUT_MINUTES = 15;
function getLoginLockoutState(){
  try{
    const raw = localStorage.getItem(LOGIN_LOCKOUT_LS_KEY);
    return raw ? JSON.parse(raw) : {count:0, lockedUntil:0};
  }catch(e){ return {count:0, lockedUntil:0}; }
}
function setLoginLockoutState(state){
  try{ localStorage.setItem(LOGIN_LOCKOUT_LS_KEY, JSON.stringify(state)); }catch(e){}
}
function registerFailedLogin(){
  const state = getLoginLockoutState();
  state.count = (state.count||0) + 1;
  if(state.count >= MAX_LOGIN_ATTEMPTS){
    state.lockedUntil = Date.now() + LOCKOUT_MINUTES*60*1000;
    state.count = 0;
  }
  setLoginLockoutState(state);
}
function clearLoginLockout(){
  setLoginLockoutState({count:0, lockedUntil:0});
}
function checkLoginLockout(){
  const state = getLoginLockoutState();
  if(state.lockedUntil && Date.now() < state.lockedUntil){
    const minutesLeft = Math.ceil((state.lockedUntil - Date.now())/60000);
    return minutesLeft;
  }
  return 0;
}

function updateCommuneField(country, dept, selectedCommune){

function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxSize = 200;
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = h*(maxSize/w); w = maxSize; } }
        else { if(h > maxSize){ w = w*(maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function compressProofImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxSize = 1400;
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxSize){ h = h*(maxSize/w); w = maxSize; } }
        else { if(h > maxSize){ w = w*(maxSize/h); h = maxSize; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.9));
      };
      img.onerror = reject;

    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let pendingListenerUnsub = null;
let lastKnownPendingCount = null;
let notifAudioCtx = null;
let notifAudioUnlocked = false;

function unlockNotifAudio(){
  const el = document.getElementById('notifSound');
  if(el && !notifAudioUnlocked){
    el.muted = true;
    el.play().then(()=>{
      el.pause();
      el.currentTime = 0;
      el.muted = false;
      notifAudioUnlocked = true;
    }).catch(()=>{});
  }
  if(!notifAudioCtx){
    try{ notifAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(notifAudioCtx && notifAudioCtx.state === 'suspended'){ notifAudioCtx.resume().catch(()=>{}); }
}
document.addEventListener('click', unlockNotifAudio, {once:false});
document.addEventListener('touchstart', unlockNotifAudio, {once:false});

function playNotificationSound(){
  const el = document.getElementById('notifSound');
  if(el){
    try{
      el.currentTime = 0;
      const p = el.play();
      if(p && p.catch) p.catch(()=>{ playBeepFallback(); });
    }catch(e){ playBeepFallback(); }
  } else {
    playBeepFallback();
  }
}

function playBeepFallback(){
  try{
    if(!notifAudioCtx) notifAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = notifAudioCtx;
    const now = ctx.currentTime;
    [0, 0.16].forEach((offset, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = i === 0 ? 880 : 1046.5;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.35, now + offset + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.3);
    });
  }catch(e){}
}

let audioCtx = null;
function playPouf(delay){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    const startTime = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, startTime);
    osc.frequency.exponentialRampToValueAtTime(80, startTime + 0.15);
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.exponentialRampToValueAtTime(0.35, startTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.18);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + 0.2);
  }catch(e){}
}

async function confirmPickup(trackingId){
  // Déclenché immédiatement pour rester lié au geste de l'utilisateur (sinon le son est bloqué par le téléphone)
  triggerConfetti();
  try{
    const pkg = await getPackage(trackingId);
    if(!pkg) return;
    const history = pkg.history || [];
    history.push({status:'livre', date:new Date().toISOString()});
    await savePackage({...pkg, status:'livre', updatedAt:new Date().toISOString(), history, pickedUpAt:new Date().toISOString()});
    toast("Merci ! Bonne réception 🎉");
    renderClient();
  }catch(e){ toast("Erreur, réessayez"); }
}

      const trackingId = document.getElementById('quickTrackInput').value.trim();
      const resultEl = document.getElementById('quickTrackResult');
      const quickEmail = document.getElementById('quickTrackEmail').value.trim();
      if(!trackingId){ toast("Entrez un numéro de suivi"); return; }
      if(quickEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(quickEmail)){ toast("Adresse email invalide"); return; }
      resultEl.innerHTML = `<div class="empty">Recherche...</div>`;
      try{
        const clean = trackingId.replace(/\s+/g,'').toUpperCase();
        let pkg = await getPackage(clean);
        if(!pkg && clean !== trackingId) pkg = await getPackage(trackingId);
        resultEl.innerHTML = pkg ? pkgCardHTML(pkg) : `<div class="empty">Aucun colis trouvé avec ce numéro.</div>`;
        if(pkg){
          const btn = resultEl.querySelector('[data-pickup]');
          if(btn) btn.onclick = ()=> confirmPickup(btn.dataset.pickup);
          if(quickEmail){
            const okBox = document.createElement('div');
            okBox.style.marginTop = '14px';
            try{
              await saveTrackingAlert(pkg.trackingId, quickEmail);
              okBox.innerHTML = `<div class="empty">✅ Vous recevrez un email à chaque changement de statut.</div>`;
              toast("✅ Vous serez prévenu par email");
            }catch(e){
              okBox.innerHTML = `<div class="empty">⚠️ Colis trouvé, mais l'email n'a pas pu être enregistré. Réessayez.</div>`;
              toast("Erreur d'enregistrement de l'email");
            }
            resultEl.appendChild(okBox);
            return;
          }
          const box = document.createElement('div');
          box.style.marginTop = '14px';
          box.innerHTML = `
            <label>🔔 Recevoir un email à chaque changement (facultatif)</label>
            <input id="alertEmail" type="email" placeholder="votre@email.com">
            <button class="primary" id="btnAlertEmail" style="margin-top:8px;">Me prévenir par email</button>`;
          resultEl.appendChild(box);
          document.getElementById('btnAlertEmail').onclick = async ()=>{
            const email = document.getElementById('alertEmail').value.trim();
            if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast("Adresse email invalide"); return; }
            try{
              await saveTrackingAlert(pkg.trackingId, email);
              toast("✅ Vous serez prévenu par email");
              box.innerHTML = `<div class="empty">✅ Vous recevrez un email à chaque changement de statut.</div>`;
            }catch(e){ toast("Erreur, réessayez"); }
          };
        }
      }catch(e){ resultEl.innerHTML = `<div class="empty">Erreur, réessayez.</div>`; }
    };
    document.getElementById('btnRegister').onclick = async ()=>{
      if(!firebaseReady){ toast("Firebase non configuré"); return; }
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      if(!name || !email || !phone){ toast("Merci de remplir tous les champs"); return; }
      if(!email.includes('@')){ toast("Email invalide"); return; }
      try{
        const existing = await getClient(phone);
        if(existing && existing.email && existing.email.toLowerCase() !== email.toLowerCase()){
          toast("Cet email est introuvable, veuillez utiliser une autre adresse.");
          return;
        }
        await saveClient(phone, name, email);
        clientPhone = normalizePhone(phone);
        renderClient();
      }catch(e){ toast("Erreur d'enregistrement, réessayez"); }
    };
    return;
  }

  main.innerHTML = `<div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <div><p class="sub" style="margin:0">Connecté avec le numéro</p><b>${clientPhone}</b></div>

    </div>
    <div id="pkgList"><div class="empty">Chargement...</div></div>`;

    if(pkgs.length===0){

    } else {

      list.querySelectorAll('[data-pickup]').forEach(btn=>{
        btn.onclick = ()=> confirmPickup(btn.dataset.pickup);
      });
    }
  }catch(e){
    document.getElementById('pkgList').innerHTML = `<div class="card"><div class="empty"><div class="big">⚠️</div>Impossible de récupérer vos colis pour le moment.</div></div>`;
  }
}

      if(newCode.length !== 4 || !/^\d{4}$/.test(newCode)){

    document.getElementById('btnSaveAmounts').onclick = async ()=>{
      const minHTG = parseFloat(document.getElementById('minHTG').value);
      const minUSD = parseFloat(document.getElementById('minUSD').value);
      const trialDays = parseInt(document.getElementById('trialDays').value);
      const regFeeHTG = parseFloat(document.getElementById('regFeeHTG').value);

    PAYMENT_METHODS.forEach(m=>{
      document.querySelector(`[data-toggle-icon="${m.key}"]`).onclick = ()=>{
        const detail = document.getElementById(`detail-icon-${m.key}`);

          toast("Icône enregistrée");
        }catch(err){
          preview.innerHTML = `<span class="sub" style="font-size:11px;color:var(--danger);">Erreur lors de l'envoi, réessayez</span>`;

    document.getElementById('supportAvatarInput').onchange = async (e)=>{
      const file = e.target.files[0];

      try{
        const dataUrl = await compressImage(file);

    };
  }catch(e){
    content.innerHTML = `<div class="card"><div class="empty">Impossible de charger les paiements.</div></div>`;
  }
}

async function renderOwnerPackages(){
  const content = document.getElementById('ownerContent');
  const optionsHtml = STATUSES.map(s=>`<option value="${s.key}">${s.label}</option>`).join('');
  const isEditing = !!editingTrackingId;
  content.innerHTML = `
    <div class="card">
      <h2>${isEditing ? 'Modifier le colis' : 'Ajouter un colis'}</h2>
      ${isEditing ? `<div class="editingBanner"><span>Modification de #${editingTrackingId}</span><button class="ghost" id="btnCancelEdit">Annuler</button></div>` : ''}
      <label>Numéro de suivi</label>
      <input id="pTrack" placeholder="Ex : STS-2026-001" ${isEditing ? 'disabled' : ''}>
      <label>Nom du client</label>
      <input id="pName" placeholder="Ex : Marie Dupont">
      <label>Téléphone du client</label>
      <input id="pPhone" type="tel" placeholder="Ex : 06 12 34 56 78">
      ${buildLocationSelectsHTML()}
      <label>Statut</label>
      <select id="pStatus">${optionsHtml}</select>
      <button class="primary" id="btnSavePkg">${isEditing ? 'Mettre à jour le colis' : 'Enregistrer le colis'}</button>
    </div>
    <div class="card">
      <h2>📊 Suivi par destination</h2>
      <label>Mois</label>
      <select id="monthFilter"></select>
      <label>Filtrer par département</label>
      <select id="destFilter"><option value="">Toutes les destinations</option>${Object.keys(HAITI_LOCATIONS).map(d=>`<option value="${d}">${d}</option>`).join('')}</select>
      <div id="destStats" style="margin-top:14px;"><div class="empty">Chargement...</div></div>
      <div id="destFilterResults" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <h2>Tous les colis</h2>
      <div id="adminList"><div class="empty">Chargement...</div></div>
    </div>`;
  initLocationFields('','','');

  if(isEditing){
    try{
      const existing = await getPackage(editingTrackingId);
      if(existing){
        document.getElementById('pTrack').value = existing.trackingId;
        document.getElementById('pName').value = existing.name || '';
        document.getElementById('pPhone').value = existing.phone || '';
        document.getElementById('pStatus').value = existing.status || 'preparation';
        initLocationFields(existing.destCountry||'', existing.destDepartment||'', existing.destCommune||'');
      }
    }catch(e){}
    document.getElementById('btnCancelEdit').onclick = ()=>{ editingTrackingId = null; renderAdmin(); };
  }

  document.getElementById('btnSavePkg').onclick = async ()=>{
    if(!firebaseReady){ toast("Firebase non configuré"); return; }
    const trackingId = isEditing ? editingTrackingId : document.getElementById('pTrack').value.replace(/\s+/g,'').toUpperCase();
    const name = document.getElementById('pName').value.trim();
    const phone = document.getElementById('pPhone').value.trim();
    const status = document.getElementById('pStatus').value;
    const destCountry = document.getElementById('pCountry').value;
    const destDepartment = document.getElementById('pDept') ? document.getElementById('pDept').value : '';
    const destCommune = document.getElementById('pCommune') ? document.getElementById('pCommune').value : '';
    if(!trackingId || !phone || !name){ toast("Nom, numéro de suivi et téléphone requis"); return; }
    try{
      if(!isEditing){
        const dejaPris = await getPackage(trackingId);
        if(dejaPris){ toast("Ce numéro de suivi existe déjà. Choisissez-en un autre."); return; }
      }
      let history = [];
      let existingPickedUpAt = null;
      if(isEditing){
        const existing = await getPackage(trackingId);
        history = (existing && existing.history) ? existing.history : [];
        existingPickedUpAt = (existing && existing.pickedUpAt) ? existing.pickedUpAt : null;
      }
      const lastStatus = history.length ? history[history.length-1].status : null;
      const statusChanged = status !== lastStatus;
      if(statusChanged){
        history.push({status, date:new Date().toISOString()});
      }
      const pkg = {trackingId, name, phone: normalizePhone(phone), status, destCountry, destDepartment, destCommune, updatedAt:new Date().toISOString(), history, companyCode: adminSession.code};
      if(existingPickedUpAt) pkg.pickedUpAt = existingPickedUpAt;
      await savePackage(pkg);
      if(statusChanged) sendStatusEmail(pkg);
      toast(isEditing ? "Colis mis à jour" : "Colis enregistré");
      editingTrackingId = null;
      renderAdmin();
    }catch(e){ toast("Erreur d'enregistrement"); }
  };

  try{
    const allPkgsForStats = await getAllPackages();

    const monthOptions = [];
    const now0 = new Date();
    for(let i=0;i<6;i++){
      const d = new Date(now0.getFullYear(), now0.getMonth()-i, 1);
      monthOptions.push({year:d.getFullYear(), month:d.getMonth(), label:d.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})});
    }
    const monthSelect = document.getElementById('monthFilter');
    monthSelect.innerHTML = monthOptions.map((m,i)=>`<option value="${i}">${m.label}${i===0?' (en cours)':''}</option>`).join('');

    function renderStatsForMonth(idx){
      const {year, month} = monthOptions[idx];
      const monthPkgs = allPkgsForStats.filter(p=>{
        const d = new Date((p.history&&p.history[0]&&p.history[0].date) || p.updatedAt);
        return d.getFullYear()===year && d.getMonth()===month;
      });
      const counts = {};
      monthPkgs.forEach(p=>{
        const key = p.destDepartment || 'Non renseigné';
        counts[key] = (counts[key]||0) + 1;
      });
      const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
      const maxCount = sorted.length ? sorted[0][1] : 1;
      const statsEl = document.getElementById('destStats');
      if(sorted.length===0){
        statsEl.innerHTML = `<div class="empty">Aucun colis pour ce mois.</div>`;
      } else {
        statsEl.innerHTML = `<p class="sub" style="margin-bottom:8px;">Colis par département</p>` + sorted.map(([dept,count])=>`
          <div style="margin-bottom:8px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;"><span>${dept}</span><b>${count}</b></div>
            <div style="background:var(--panel2);border-radius:8px;height:8px;overflow:hidden;"><div style="background:linear-gradient(90deg,#0EA5E9,#6366F1);height:100%;width:${Math.round((count/maxCount)*100)}%;"></div></div>
          </div>`).join('');
      }
    }
    renderStatsForMonth(0);
    monthSelect.onchange = ()=> renderStatsForMonth(parseInt(monthSelect.value));

    document.getElementById('destFilter').onchange = async (e)=>{
      const dept = e.target.value;
      const resultsEl = document.getElementById('destFilterResults');
      if(!dept){ resultsEl.innerHTML = ''; return; }
      const matches = allPkgsForStats.filter(p=>p.destDepartment === dept);
      if(matches.length === 0){
        resultsEl.innerHTML = `<div class="empty">Aucun colis pour ${dept}.</div>`;
      } else {
        resultsEl.innerHTML = matches.map(p=>`
          <div class="pkgAdmin" style="flex-direction:column;align-items:stretch;">
            <div><b>#${p.trackingId}</b> — ${STATUS_LABEL[p.status]||p.status}</div>
            <div class="name">${p.name} · ${[p.destCommune,p.destDepartment].filter(Boolean).join(', ')}</div>
          </div>`).join('');
      }
    };
  }catch(e){}

  try{
    const pkgs = await getCompanyPackages(adminSession.code);
    const list = document.getElementById('adminList');
    if(pkgs.length===0){
      list.innerHTML = `<div class="empty">Aucun colis enregistré pour le moment.</div>`;
    } else {
      list.innerHTML = (await Promise.all(pkgs.map(async p=>{
        const hist = (p.history||[]).slice().reverse().map(h=>
          `<div class="histline"><div class="dot"></div><div>${STATUS_LABEL[h.status]||h.status} — ${new Date(h.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`
        ).join('');
        const client = await getClient(p.phone);
        const lastSeen = client && client.lastSeen
          ? `Dernière visite client : ${new Date(client.lastSeen).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}`
          : `Ce client n'a pas encore consulté l'appli`;
        const pickupConfirm = p.pickedUpAt
          ? `<div style="margin-top:4px;font-size:11px;color:var(--ok);">✅ Récupération confirmée par le client — ${new Date(p.pickedUpAt).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`
          : '';
        return `
        <div class="pkgAdmin" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="info" data-edit="${p.trackingId}" style="cursor:pointer;flex:1;">
              <div><b>#${p.trackingId}</b> — ${STATUS_LABEL[p.status]||p.status}</div>
              <div class="name">${p.name} · ${p.phone}</div>
              ${(p.destCommune||p.destDepartment) ? `<div class="sub" style="font-size:11px;">📍 ${[p.destCommune,p.destDepartment,p.destCountry].filter(Boolean).join(', ')}</div>` : ''}
            </div>
            <button class="miniBtn" data-id="${p.trackingId}">Supprimer</button>
          </div>
          ${hist ? `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">${hist}</div>` : ''}
          <div style="margin-top:6px;font-size:11px;color:var(--muted);">${lastSeen}</div>
          ${pickupConfirm}
        </div>`;
      }))).join('');
      list.querySelectorAll('.miniBtn').forEach(b=>{
        b.onclick = async (e)=>{
          e.stopPropagation();
          await deletePackage(b.dataset.id);
          toast("Colis supprimé");
          renderAdmin();
        };
      });
      list.querySelectorAll('.info[data-edit]').forEach(el=>{
        el.onclick = ()=>{
          editingTrackingId = el.dataset.edit;
          renderAdmin();
        };
      });
    }
  }catch(e){
    document.getElementById('adminList').innerHTML = `<div class="empty">Impossible de charger les colis.</div>`;
  }
}

function validateProofFile(file){
  if(!['image/jpeg','image/png'].includes(file.type)){
    return "Format non supporté. Veuillez choisir une image au format JPG ou PNG.";
  }
  if(file.size > 5*1024*1024){
    return "Cette photo est trop lourde. La taille maximale autorisée est de 5 Mo.";

}

async function renderAdmin(){
  const main = document.getElementById('main');
  if(!adminSession){
    if(showCompanyRegister){
      const pSettings = await getPaymentSettings();
      main.innerHTML = `
        ${firebaseWarningHTML()}
        <div class="card">
          <h2>Inscrire une nouvelle entreprise</h2>
          <p class="sub">Votre code d'accès sera les 4 premiers chiffres du téléphone de l'entreprise.</p>

          <label>Téléphone de l'entreprise</label>
          <input id="cPhone" type="tel" placeholder="Ex : 509 4012 3456">

          <input id="cAdminName" placeholder="Votre nom">
          <label>Adresse email</label>
          <input id="cEmail" type="email" placeholder="vous@email.com">
          <label>Votre numéro de téléphone</label>
          <input id="cAdminPhone" type="tel" placeholder="Ex : 509 4012 3456">
          <div id="customCodeBlock" style="display:none;">
            <div class="warnBox" style="margin:10px 0;color:var(--danger);border-color:rgba(239,93,93,0.3);background:rgba(239,93,93,0.1);">
              Le code basé sur votre numéro est déjà utilisé par une autre entreprise. Choisissez un code personnalisé (4 chiffres) à la place.
            </div>
            <label>Code personnalisé (4 chiffres)</label>
            <input id="cCustomCode" type="text" inputmode="numeric" maxlength="4" placeholder="Ex : 7788">
          </div>
          <button class="primary" id="btnCompanyRegister">S'inscrire</button>
          <button class="ghost" style="margin-top:10px;width:100%;" id="btnBackToLogin">J'ai déjà un code</button>
        </div>
        ${whatsappBubbleHTML()}`;
      document.getElementById('btnBackToLogin').onclick = ()=>{ showCompanyRegister=false; renderAdmin(); };
      document.getElementById('btnCompanyRegister').onclick = async ()=>{
        if(!firebaseReady){ toast("Firebase non configuré"); return; }
        const companyName = document.getElementById('cName').value.trim();
        const companyPhone = document.getElementById('cPhone').value.trim();
        const adminName = document.getElementById('cAdminName').value.trim();
        const adminEmail = document.getElementById('cEmail').value.trim();
        const adminPhone = document.getElementById('cAdminPhone').value.trim();
        const customCodeEl = document.getElementById('cCustomCode');
        const customCode = customCodeEl ? customCodeEl.value.trim() : '';
        if(!companyName || !companyPhone || !adminName || !adminEmail || !adminPhone){ toast("Merci de remplir tous les champs"); return; }
        if(document.getElementById('customCodeBlock').style.display === 'block' && customCode.length !== 4){
          toast("Merci d'entrer un code personnalisé à 4 chiffres");
          return;
        }
        try{
          const code = await registerCompany(companyName, companyPhone, adminName, adminEmail, adminPhone, customCode || null);
          toast("Entreprise inscrite ! Votre code : "+code);
          showCompanyRegister = false;
          adminSession = {code, isOwner:false, companyName};
          renderAdmin();
        }catch(e){
          if(e.code === 'ALREADY_REGISTERED'){
            toast("Ce numéro est déjà inscrit. Utilisez votre code existant pour vous connecter (bouton \"J'ai déjà un code\").");
          } else if(e.code === 'CODE_TAKEN'){
            document.getElementById('customCodeBlock').style.display = 'block';
            toast("Ce code est déjà utilisé. Choisissez un code personnalisé ci-dessous.");
          } else {
            toast("Erreur lors de l'inscription");
          }
        }
      };
      return;
    }

    const lockoutMinutes = checkLoginLockout();
    main.innerHTML = `
      ${firebaseWarningHTML()}
      <div class="card">
        <h2>Espace Admin</h2>
        ${lockoutMinutes > 0 ? `<div class="warnBox" style="color:var(--danger);border-color:rgba(239,93,93,0.3);background:rgba(239,93,93,0.1);">🔒 Trop de tentatives échouées. Réessayez dans ${lockoutMinutes} minute${lockoutMinutes>1?'s':''}.</div>` : `
        <p class="sub">Entrez les 4 premiers chiffres de votre numéro de téléphone.</p>
        <label>Code (4 chiffres)</label>
        <div style="position:relative;">
          <input id="pinInput" type="text" inputmode="numeric" maxlength="4" placeholder="••••" style="padding-right:46px;-webkit-text-security:disc;">
          <button type="button" id="togglePin" style="position:absolute;right:10px;top:9px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;">🙈</button>
        </div>
        <button class="primary" id="btnUnlock">Accéder</button>
        <button class="ghost" style="margin-top:10px;width:100%;" id="btnGoRegister">Nouvelle entreprise ? S'inscrire</button>
        `}
      </div>
      ${whatsappBubbleHTML()}`;
    if(lockoutMinutes > 0) return;
    document.getElementById('btnGoRegister').onclick = ()=>{ showCompanyRegister=true; renderAdmin(); };
    document.getElementById('togglePin').onclick = ()=>{
      const inp = document.getElementById('pinInput');
      const btn = document.getElementById('togglePin');
      const isHidden = inp.style.webkitTextSecurity !== 'none';
      if(isHidden){ inp.style.webkitTextSecurity = 'none'; btn.textContent = '👁️'; }
      else { inp.style.webkitTextSecurity = 'disc'; btn.textContent = '🙈'; }
    };
    document.getElementById('btnUnlock').onclick = async ()=>{
      const code = document.getElementById('pinInput').value.trim();
      if(!firebaseReady){ toast("Firebase non configuré"); return; }
      try{
        const ownerCode = await getOwnerCode();
        if(ownerCode && code === ownerCode){
          clearLoginLockout();
          adminSession = {code, isOwner:true};
          startPendingListener();
          renderAdmin();
          return;
        }
        const company = await getCompanyByCode(code);
        if(!company){
          registerFailedLogin();
          toast("Code invalide. Inscrivez votre entreprise d'abord.");
          renderAdmin();
          return;
        }
        clearLoginLockout();
        if(company.blocked){
          main.innerHTML = `<div class="card"><div class="warnBox" style="color:var(--danger);border-color:rgba(239,93,93,0.3);background:rgba(239,93,93,0.1);">
            🚫 Vous avez été temporairement bloqué par SamTraceStore. Veuillez contacter le support.</div></div>${whatsappBubbleHTML()}`;
          return;
        }
        if(company.justUnblocked){
          await db.collection('companies').doc(code).set({justUnblocked:false},{merge:true});
          toast("✅ SamTraceStore a débloqué votre accès");
        }
        adminSession = {code, isOwner:false, companyName:company.companyName};
        renderAdmin();
      }catch(e){ toast("Erreur, réessayez"); }
    };
    return;
  }

  if(adminSession.isOwner){
    await renderOwnerPanel(main);
    return;
  }

  const gateCompany = await getCompanyByCode(adminSession.code);
  const regPaymentStatus = gateCompany ? (gateCompany.regPaymentStatus || 'active') : 'active';
  if(regPaymentStatus !== 'active'){
    await renderRegistrationGate(main, gateCompany, regPaymentStatus);
    return;
  }

  const paymentStatus = gateCompany ? (gateCompany.paymentStatus || 'active') : 'active';
  const inTrial = gateCompany && gateCompany.trialEndsAt && new Date(gateCompany.trialEndsAt) > new Date();

  if(paymentStatus !== 'active' && !inTrial){
    await renderPaymentGate(main, gateCompany, paymentStatus);
    return;
  }

  const showConfirmBanner = gateCompany && gateCompany.notifiedForPayment === false;

  const trialBanner = (inTrial && paymentStatus !== 'active')
    ? `<div class="warnBox" style="margin-bottom:14px;">🎁 Essai gratuit actif jusqu'au ${new Date(gateCompany.trialEndsAt).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}. Pensez à activer votre compte avant cette date.</div>`
    : '';

  const confirmBanner = showConfirmBanner
    ? `<div class="card" style="border:1px solid var(--ok);background:rgba(62,207,142,0.1);">
        <div style="font-weight:700;color:var(--ok);margin-bottom:6px;">🎉 Félicitations !</div>
        <p class="sub" style="margin:0 0 12px;">Votre dépôt a été validé. Votre compte entreprise est désormais actif.</p>
        <button class="primary" id="btnDismissConfirm">C'est noté</button>
      </div>`
    : '';

  const notifCard = `<div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
        <span style="font-size:20px;">🔔</span><h2 style="margin:0;">Notification</h2>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span class="sub">Statut notification</span>
        <span style="color:var(--ok);font-weight:700;">✅ Active</span>
      </div>
      <div style="background:var(--accent);color:#0B1120;border-radius:10px;padding:10px;text-align:center;font-weight:700;">✅ Notification activée</div>
    </div>`;

  const optionsHtml = STATUSES.map(s=>`<option value="${s.key}">${s.label}</option>`).join('');
  const isEditing = !!editingTrackingId;
  const myCompany = gateCompany;
  const logoImg = myCompany && myCompany.logoUrl ? myCompany.logoUrl : null;
  main.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <div style="display:flex;align-items:center;gap:10px;">
        ${logoImg ? `<img src="${logoImg}" style="width:40px;height:40px;border-radius:10px;object-fit:cover;">` : ''}
        <div><p class="sub" style="margin:0">Connecté en tant que</p><b>${adminSession.companyName||'Admin'}</b></div>
      </div>
      <button class="ghost" id="btnAdminLogout">Déconnexion</button>
    </div>
    ${confirmBanner}
    ${trialBanner}
    ${notifCard}
    <div class="card">
      <h2>Logo de l'entreprise</h2>
      <p class="sub">Choisissez une image depuis votre galerie. Vous pouvez la changer à tout moment.</p>
      ${logoImg ? `<img src="${logoImg}" style="width:72px;height:72px;border-radius:14px;object-fit:cover;margin-bottom:12px;">` : ''}
      <input type="file" id="logoInput" accept="image/*" style="margin-bottom:12px;">
    </div>
    <div class="card">
      <h2>${isEditing ? 'Modifier le colis' : 'Ajouter un colis'}</h2>
      ${isEditing ? `<div class="editingBanner"><span>Modification de #${editingTrackingId}</span><button class="ghost" id="btnCancelEdit">Annuler</button></div>` : ''}
      <label>Numéro de suivi</label>
      <input id="pTrack" placeholder="Ex : STS-2026-001" ${isEditing ? 'disabled' : ''}>
      <label>Nom du client</label>
      <input id="pName" placeholder="Ex : Marie Dupont">
      <label>Téléphone du client</label>
      <input id="pPhone" type="tel" placeholder="Ex : 06 12 34 56 78">
      ${buildLocationSelectsHTML()}
      <label>Statut</label>
      <select id="pStatus">${optionsHtml}</select>
      <button class="primary" id="btnSavePkg">${isEditing ? 'Mettre à jour le colis' : 'Enregistrer le colis'}</button>
    </div>
    <div class="card">
      <h2>Tous les colis</h2>
      <div id="adminList"><div class="empty">Chargement...</div></div>
    </div>
    ${whatsappBubbleHTML()}`;
  initLocationFields('','','');
  document.getElementById('btnAdminLogout').onclick = ()=>{ adminSession=null; editingTrackingId=null; renderAdmin(); };
  if(showConfirmBanner){
    document.getElementById('btnDismissConfirm').onclick = async ()=>{
      await markPaymentNotified(adminSession.code);
      renderAdmin();
    };
  }
  document.getElementById('logoInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await compressImage(file);
      await saveCompanyLogo(adminSession.code, dataUrl);
      toast("Logo mis à jour");
      renderAdmin();
    }catch(err){ toast("Erreur lors de l'envoi de l'image"); }
  };

  if(isEditing){
    try{
      const existing = await getPackage(editingTrackingId);
      if(existing){
        document.getElementById('pTrack').value = existing.trackingId;
        document.getElementById('pName').value = existing.name || '';
        document.getElementById('pPhone').value = existing.phone || '';
        document.getElementById('pStatus').value = existing.status || 'preparation';
        initLocationFields(existing.destCountry||'', existing.destDepartment||'', existing.destCommune||'');
      }
    }catch(e){}
    document.getElementById('btnCancelEdit').onclick = ()=>{ editingTrackingId = null; renderAdmin(); };
  }

  document.getElementById('btnSavePkg').onclick = async ()=>{
    if(!firebaseReady){ toast("Firebase non configuré"); return; }
    const trackingId = isEditing ? editingTrackingId : document.getElementById('pTrack').value.replace(/\s+/g,'').toUpperCase();
    const name = document.getElementById('pName').value.trim();
    const phone = document.getElementById('pPhone').value.trim();
    const status = document.getElementById('pStatus').value;
    const destCountry = document.getElementById('pCountry').value;
    const destDepartment = document.getElementById('pDept') ? document.getElementById('pDept').value : '';
    const destCommune = document.getElementById('pCommune') ? document.getElementById('pCommune').value : '';
    if(!trackingId || !phone || !name){ toast("Nom, numéro de suivi et téléphone requis"); return; }
    try{
      if(!isEditing){
        const dejaPris = await getPackage(trackingId);
        if(dejaPris){ toast("Ce numéro de suivi existe déjà. Choisissez-en un autre."); return; }
      }
      let history = [];
      let existingPickedUpAt = null;
      if(isEditing){
        const existing = await getPackage(trackingId);
        history = (existing && existing.history) ? existing.history : [];
        existingPickedUpAt = (existing && existing.pickedUpAt) ? existing.pickedUpAt : null;
      }
      const lastStatus = history.length ? history[history.length-1].status : null;
      const statusChanged = status !== lastStatus;
      if(statusChanged){
        history.push({status, date:new Date().toISOString()});
      }
      const pkg = {trackingId, name, phone: normalizePhone(phone), status, destCountry, destDepartment, destCommune, updatedAt:new Date().toISOString(), history, companyCode: adminSession.code};
      if(existingPickedUpAt) pkg.pickedUpAt = existingPickedUpAt;
      await savePackage(pkg);
      if(statusChanged) sendStatusEmail(pkg);
      toast(isEditing ? "Colis mis à jour" : "Colis enregistré");
      editingTrackingId = null;
      renderAdmin();
    }catch(e){ toast("Erreur d'enregistrement"); }
  };

  try{
    const pkgs = await getCompanyPackages(adminSession.code);
    const list = document.getElementById('adminList');
    if(pkgs.length===0){
      list.innerHTML = `<div class="empty">Aucun colis enregistré pour le moment.</div>`;
    } else {
      list.innerHTML = (await Promise.all(pkgs.map(async p=>{
        const hist = (p.history||[]).slice().reverse().map(h=>
          `<div class="histline"><div class="dot"></div><div>${STATUS_LABEL[h.status]||h.status} — ${new Date(h.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div></div>`
        ).join('');
        const client = await getClient(p.phone);
        const lastSeen = client && client.lastSeen
          ? `Dernière visite client : ${new Date(client.lastSeen).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}`
          : `Ce client n'a pas encore consulté l'appli`;
        const pickupConfirm = p.pickedUpAt
          ? `<div style="margin-top:4px;font-size:11px;color:var(--ok);">✅ Récupération confirmée par le client — ${new Date(p.pickedUpAt).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}</div>`
          : '';
        return `
        <div class="pkgAdmin" style="flex-direction:column;align-items:stretch;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="info" data-edit="${p.trackingId}" style="cursor:pointer;flex:1;">
              <div><b>#${p.trackingId}</b> — ${STATUS_LABEL[p.status]||p.status}</div>
              <div class="name">${p.name} · ${p.phone}</div>
              ${(p.destCommune||p.destDepartment) ? `<div class="sub" style="font-size:11px;">📍 ${[p.destCommune,p.destDepartment,p.destCountry].filter(Boolean).join(', ')}</div>` : ''}
            </div>
            <button class="miniBtn" data-id="${p.trackingId}">Supprimer</button>
          </div>
          ${hist ? `<div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">${hist}</div>` : ''}
          <div style="margin-top:6px;font-size:11px;color:var(--muted);">${lastSeen}</div>
          ${pickupConfirm}
        </div>`;
      }))).join('');
      list.querySelectorAll('.miniBtn').forEach(b=>{
        b.onclick = async (e)=>{
          e.stopPropagation();
          await deletePackage(b.dataset.id);
          toast("Colis supprimé");
          renderAdmin();
        };
      });
      list.querySelectorAll('.info[data-edit]').forEach(el=>{
        el.onclick = ()=>{
          editingTrackingId = el.dataset.edit;
          renderAdmin();
        };
      });
    }
  }catch(e){
    document.getElementById('adminList').innerHTML = `<div class="empty">Impossible de charger les colis.</div>`;
  }
}

function renderShareFooter(){
  const existing = document.querySelector('footer.share');
  if(existing) existing.remove();
  if(mode !== 'client') return;
  const footer = document.createElement('footer');
  footer.className = 'share';
  const text = encodeURIComponent("📦 Suivez vos colis Sam Trace Store en temps réel avec l'application SamTraceStore ! Ouvrez ce lien puis ajoutez-le à votre écran d'accueil : " + location.href);
  footer.innerHTML = `<button class="waBtn" id="waShare">💬 Partager le lien via WhatsApp</button>`;
  document.getElementById('app').appendChild(footer);
  document.getElementById('waShare').onclick = ()=>{ window.open('https://wa.me/?text='+text, '_blank'); };
}

function closeSupportModal(){
  const m = document.getElementById('supportModal');
  if(m) m.remove();
}

const SUPPORT_LANG_KEY = 'sts_support_lang';
const SUPPORT_TEXT = {
  ht: {
    title: '💬 Sipò',
    hint: 'Ou gen yon pwoblèm ak kolis ou a (reta, estati...) ? Ekri mesaj ou anba a, n ap reponn ou sou WhatsApp.',
    track: 'Nimewo swivi (si ou genyen) Ex : STS-2026-001',
    msg: 'Ekri mesaj ou la... Ex : Kolis mwen an an reta, èske w ka verifye l ?',
    send: 'Voye',
    tooShort: 'Ekri mesaj ou anvan ou voye l',
    opening: "N ap louvri WhatsApp... peze sou voye",
    hello: 'Bonjou Sam Trace Store,',
    trackLbl: 'Nimewo swivi : ',
    phoneLbl: 'Nimewo mwen : '
  },
  fr: {
    title: '💬 Support',
    hint: 'Un souci avec votre colis (retard, statut...) ? Écrivez votre message ci-dessous, nous vous répondrons sur WhatsApp.',
    track: 'Numéro de suivi (facultatif) Ex : STS-2026-001',
    msg: 'Votre message... Ex : Mon colis est en retard, pouvez-vous vérifier ?',
    send: 'Envoyer',
    tooShort: "Écrivez votre message avant d'envoyer",
    opening: 'Ouverture de WhatsApp... appuyez sur envoyer',
    hello: 'Bonjour Sam Trace Store,',
    trackLbl: 'Numéro de suivi : ',
    phoneLbl: 'Mon numéro : '
  }
};

function getSupportLang(){
  try{
    const l = localStorage.getItem(SUPPORT_LANG_KEY);
    if(l === 'ht' || l === 'fr') return l;
  }catch(e){}
  return 'ht';
}

function openSupportModal(){
  closeSupportModal();
  let lang = getSupportLang();
  const quickEl = document.getElementById('quickTrackInput');
  const prefillTrack = quickEl ? quickEl.value.trim() : '';
  const overlay = document.createElement('div');
  overlay.id = 'supportModal';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:210;display:flex;align-items:flex-end;justify-content:center;padding:16px;';
  overlay.innerHTML = `
    <div style="width:100%;max-width:448px;background:var(--panel);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,0.5);max-height:92vh;overflow-y:auto;">
      <div style="background:linear-gradient(135deg,var(--accent),#FF5A1A);padding:18px 18px;display:flex;justify-content:space-between;align-items:center;">
        <div id="supportTitle" style="color:#fff;font-weight:800;font-size:18px;"></div>
        <button type="button" id="supportClose" style="background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;">✕</button>
      </div>
      <div style="padding:14px 18px;border-bottom:1px solid var(--border);background:#131A2A;">
        <div class="modeSwitch" style="margin-bottom:12px;width:fit-content;">
          <button type="button" id="langHt">Kreyòl</button>
          <button type="button" id="langFr">Français</button>
        </div>
        <p id="supportHint" style="margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.5;"></p>
        <input id="supportTrack" style="margin-bottom:0;">
      </div>
      <div style="padding:16px 18px 20px;">
        <textarea id="supportMsg" rows="4" style="width:100%;background:#fff;color:#111;border:1px solid var(--border);border-radius:10px;padding:12px 13px;font-size:14.5px;margin-bottom:14px;outline:none;font-family:inherit;resize:vertical;"></textarea>
        <button type="button" class="primary" id="supportSend"></button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  function applyLang(){
    const t = SUPPORT_TEXT[lang];
    document.getElementById('supportTitle').textContent = t.title;
    document.getElementById('supportHint').textContent = t.hint;
    document.getElementById('supportTrack').placeholder = t.track;
    document.getElementById('supportMsg').placeholder = t.msg;
    document.getElementById('supportSend').textContent = t.send;
    document.getElementById('langHt').classList.toggle('active', lang === 'ht');
    document.getElementById('langFr').classList.toggle('active', lang === 'fr');
  }
  applyLang();
  document.getElementById('supportTrack').value = prefillTrack;
  document.getElementById('langHt').onclick = ()=>{ lang = 'ht'; try{ localStorage.setItem(SUPPORT_LANG_KEY, lang); }catch(e){} applyLang(); };
  document.getElementById('langFr').onclick = ()=>{ lang = 'fr'; try{ localStorage.setItem(SUPPORT_LANG_KEY, lang); }catch(e){} applyLang(); };
  document.getElementById('supportClose').onclick = closeSupportModal;
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSupportModal(); };
  document.getElementById('supportSend').onclick = ()=>{
    const t = SUPPORT_TEXT[lang];
    const msg = document.getElementById('supportMsg').value.trim();
    const track = document.getElementById('supportTrack').value.trim();
    if(msg.length < 5){ toast(t.tooShort); return; }
    let text = t.hello + "\n\n" + msg;
    if(track) text += "\n\n" + t.trackLbl + track;
    if(clientPhone) text += "\n" + t.phoneLbl + clientPhone;
    window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(text), '_blank');
    closeSupportModal();
    toast(t.opening);
  };
}

function renderSupportButton(){
  const existing = document.getElementById('clientSupportBtn');
  if(existing) existing.remove();
  if(mode !== 'client') return;
  const inner = supportAvatarUrl
    ? `<img src="${supportAvatarUrl}" style="width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:center ${supportAvatarPos}%;flex-shrink:0;">`
    : `<span style="font-size:20px;line-height:1;">💬</span>`;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.id = 'clientSupportBtn';
  btn.style.cssText = 'position:fixed;bottom:20px;right:16px;display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;border-radius:30px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--accent),#FF5A1A);color:#fff;font-weight:700;font-size:13.5px;box-shadow:0 6px 18px rgba(255,122,26,0.45);z-index:60;';
  btn.innerHTML = `${inner}<span>Sipò · Support</span>`;
  btn.onclick = openSupportModal;
  document.body.appendChild(btn);
}

function render(){
  if(mode === 'client') renderClient(); else renderAdmin();
  renderShareFooter();
  renderSupportButton();
}

document.getElementById('btnClientMode').onclick = ()=>{
  mode='client';
  document.getElementById('btnClientMode').classList.add('active');
  document.getElementById('btnAdminMode').classList.remove('active');
  render();
};
document.getElementById('btnAdminMode').onclick = ()=>{
  mode='admin';
  document.getElementById('btnAdminMode').classList.add('active');
  document.getElementById('btnClientMode').classList.remove('active');
  render();
};

render();
loadSupportAvatar().then(()=>{ if(supportAvatarUrl) render(); });

document.addEventListener('click', (e)=>{
  const zoomEl = e.target.closest('[data-zoom]');
  if(zoomEl){
    document.getElementById('lightboxImg').src = zoomEl.dataset.zoom;
    document.getElementById('lightbox').classList.add('show');
    return;
  }
  if(e.target.id === 'lightbox' || e.target.id === 'lightboxClose'){
    document.getElementById('lightbox').classList.remove('show');
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
