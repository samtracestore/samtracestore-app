async function renderAdminCore(){
  const main = document.getElementById('main');
  if(!adminSession){
    if(showCompanyRegister){
      const pSettings = await getPaymentSettings();
      main.innerHTML = `
        ${firebaseWarningHTML()}
        <div class="card">
          <h2>Inscrire une nouvelle entreprise</h2>
          <p class="sub">Votre code d'accès sera les 4 premiers chiffres du téléphone de l'entreprise.</p>
          <div class="warnBox" style="margin-bottom:14px;">
            💰 Frais d'inscription : ${pSettings.regFeeHTG} HTG (ou ${pSettings.regFeeUSD} USD), à payer une seule fois.<br>
            🎁 Essai gratuit de ${pSettings.trialDays} jours inclus dès l'inscription.<br>
            💳 Ensuite, abonnement de ${pSettings.minHTG} HTG (ou ${pSettings.minUSD} USD) par mois pour continuer à utiliser la plateforme.
          </div>
          <label>Nom de l'entreprise</label>
          <input id="cName" placeholder="Ex : Boutique Aurore">
          <label>Téléphone de l'entreprise</label>
          <input id="cPhone" type="tel" placeholder="Ex : 509 4012 3456">
          <label>Nom du compte admin</label>
          <input id="cAdminName" placeholder="Votre nom">
          <label>Adresse email</label>
          <input id="cEmail" type="email" placeholder="vous@email.com">
          <label>Votre numéro de téléphone</label>
          <input id="cAdminPhone" type="tel" placeholder="Ex : 509 4012 3456">
          <div id="customCodeBlock" style="display:none;">
            <div class="warnBox" style="margin:10px 0;color:var(--danger);border-color:rgba(239,93,93,0.3);background:rgba(239,93,93,0.1);">
              Le code basé sur votre numéro est déjà utilisé par une autre entreprise. Choisissez un code personnalisé (4 chiffres) à la place.
            </div>
            <label>Code personnalisé (4 chiffres)</label>
            <input id="cCustomCode" type="text" inputmode="numeric" maxlength="4" placeholder="Ex : 7788">
          </div>
          <button class="primary" id="btnCompanyRegister">S'inscrire</button>
          <button class="ghost" style="margin-top:10px;width:100%;" id="btnBackToLogin">J'ai déjà un code</button>
        </div>
        ${whatsappBubbleHTML()}`;
      document.getElementById('btnBackToLogin').onclick = ()=>{ showCompanyRegister=false; renderAdmin(); };
      document.getElementById('btnCompanyRegister').onclick = async ()=>{
        if(!firebaseReady){ toast("Firebase non configuré"); return; }
        const companyName = document.getElementById('cName').value.trim();
        const companyPhone = document.getElementById('cPhone').value.trim();
        const adminName = document.getElementById('cAdminName').value.trim();
        const adminEmail = document.getElementById('cEmail').value.trim();
        const adminPhone = document.getElementById('cAdminPhone').value.trim();
        const customCodeEl = document.getElementById('cCustomCode');
        const customCode = customCodeEl ? customCodeEl.value.trim() : '';
        if(!companyName || !companyPhone || !adminName || !adminEmail || !adminPhone){ toast("Merci de remplir tous les champs"); return; }
        if(document.getElementById('customCodeBlock').style.display === 'block' && customCode.length !== 4){
          toast("Merci d'entrer un code personnalisé à 4 chiffres");
          return;
        }
        try{
          const code = await registerCompany(companyName, companyPhone, adminName, adminEmail, adminPhone, customCode || null);
          toast("Entreprise inscrite ! Votre code : "+code);
          showCompanyRegister = false;
          adminSession = {code, isOwner:false, companyName};
          renderAdmin();
        }catch(e){
          if(e.code === 'ALREADY_REGISTERED'){
            toast("Ce numéro est déjà inscrit. Utilisez votre code existant pour vous connecter (bouton \"J'ai déjà un code\").");
          } else if(e.code === 'CODE_TAKEN'){
            document.getElementById('customCodeBlock').style.display = 'block';
            toast("Ce code est déjà utilisé. Choisissez un code personnalisé ci-dessous.");
          } else {
            toast("Erreur lors de l'inscription");
          }
        }
      };
      return;
    }

    const lockoutMinutes = checkLoginLockout('admin');
    main.innerHTML = `
      ${firebaseWarningHTML()}
      <div class="card">
        <h2>Espace Admin</h2>
        ${lockoutMinutes > 0 ? `<div class="warnBox" style="color:var(--danger);border-color:rgba(239,93,93,0.3);background:rgba(239,93,93,0.1);">🔒 Trop de tentatives échouées. Réessayez dans ${lockoutMinutes} minute${lockoutMinutes>1?'s':''}.</div>` : `
        <p class="sub">Entrez les 4 premiers chiffres de votre numéro de téléphone.</p>
        <label>Code (4 chiffres)</label>
        <div style="position:relative;">
          <input id="pinInput" type="text" inputmode="numeric" maxlength="4" placeholder="••••" style="padding-right:46px;-webkit-text-security:disc;">
          <button type="button" id="togglePin" style="position:absolute;right:10px;top:9px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;">🙈</button>
        </div>
        <button class="primary" id="btnUnlock">Accéder</button>
        <button class="ghost" style="margin-top:10px;width:100%;" id="btnGoRegister">Nouvelle entreprise ? S'inscrire</button>
        `}
      </div>
      ${whatsappBubbleHTML()}`;
    if(lockoutMinutes > 0) return;
    document.getElementById('btnGoRegister').onclick = ()=>{ showCompanyRegister=true; renderAdmin(); };
    document.getElementById('togglePin').onclick = ()=>{
      const inp = document.getElementById('pinInput');
      const btn = document.getElementById('togglePin');
      const isHidden = inp.style.webkitTextSecurity !== 'none';
      if(isHidden){ inp.style.webkitTextSecurity = 'none'; btn.textContent = '👁️'; }
      else { inp.style.webkitTextSecurity = 'disc'; btn.textContent = '🙈'; }
    };
    document.getElementById('btnUnlock').onclick = async ()=>{
      const rawCode = document.getElementById('pinInput').value.trim();
      const code = rawCode.replace(/\D/g, '');
      if(!firebaseReady){ toast("Firebase non configuré"); return; }
      if(!code){ toast("Entrez votre code (4 chiffres)"); return; }
      const unlockBtn = document.getElementById('btnUnlock');
      if(unlockBtn.disabled) return;
      unlockBtn.disabled = true; unlockBtn.textContent = 'Vérification...';
      const restoreBtn = ()=>{ const b = document.getElementById('btnUnlock'); if(b){ b.disabled = false; b.textContent = 'Accéder'; } };
      const netMsg = "Problème de connexion internet. Réessayez : ce n'est pas compté comme une erreur de code.";
      try{
        let ownerCode = null;
        try{
          const od = await firestoreGetWithRetry(db.collection('settings').doc('ownerAuth'));
          ownerCode = od.exists ? (od.data().code || null) : null;
        }catch(e){ restoreBtn(); toast(netMsg); return; }
        if(ownerCode && (rawCode === ownerCode || code === ownerCode)){
          clearLoginLockout('admin');
          adminSession = {code, isOwner:true};
          startPendingListener();
          renderAdmin();
          return;
        }
        let company = null;
        try{
          const cd = await firestoreGetWithRetry(db.collection('companies').doc(code));
          company = cd.exists ? cd.data() : null;
        }catch(e){ restoreBtn(); toast(netMsg); return; }
        if(!company){
          registerFailedLogin('admin');
          toast("Code invalide. Inscrivez votre entreprise d'abord.");
          renderAdmin();
          return;
        }
        clearLoginLockout('admin');
        if(company.blocked){
          main.innerHTML = `<div class="card"><div class="warnBox" style="color:var(--danger);border-color:rgba(239,93,93,0.3);background:rgba(239,93,93,0.1);">
            🚫 Vous avez été temporairement bloqué par SamTraceStore. Veuillez contacter le support.</div></div>${whatsappBubbleHTML()}`;
          return;
        }
        if(company.justUnblocked){
          await db.collection('companies').doc(code).set({justUnblocked:false},{merge:true});
          toast("✅ SamTraceStore a débloqué votre accès");
        }
        adminSession = {code, isOwner:false, companyName:company.companyName};
        renderAdmin();
      }catch(e){ restoreBtn(); toast("Erreur, réessayez"); }
    };
    return;
  }

  if(adminSession.isOwner){
    await renderOwnerPanel(main);
    return;
  }

  const gateCompany = await getCompanyByCode(adminSession.code);
  const regPaymentStatus = gateCompany ? (gateCompany.regPaymentStatus || 'active') : 'active';
  if(regPaymentStatus !== 'active'){
    await renderRegistrationGate(main, gateCompany, regPaymentStatus);
    return;
  }

  const paymentStatus = gateCompany ? (gateCompany.paymentStatus || 'active') : 'active';
  const inTrial = gateCompany && gateCompany.trialEndsAt && new Date(gateCompany.trialEndsAt) > new Date();

  if(paymentStatus !== 'active' && !inTrial){
    await renderPaymentGate(main, gateCompany, paymentStatus);
    return;
  }

  const showConfirmBanner = gateCompany && gateCompany.notifiedForPayment === false;

  const trialBanner = (inTrial && paymentStatus !== 'active')
    ? `<div class="warnBox" style="margin-bottom:14px;">🎁 Essai gratuit actif jusqu'au ${new Date(gateCompany.trialEndsAt).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})}. Pensez à activer votre compte avant cette date.</div>`
    : '';

      let existingHidden = null;
      let existingDelivery = null;
      let existingPhotoMeta = null;
      if(isEditing){
        const existing = await getPackage(trackingId);
        history = (existing && existing.history) ? existing.history : [];
        existingPickedUpAt = (existing && existing.pickedUpAt) ? existing.pickedUpAt : null;
        existingHidden = (existing && existing.hiddenByClient) ? (existing.hiddenByClientAt || true) : null;
        existingDelivery = (existing && existing.deliveryDays) ? {days: existing.deliveryDays, date: existing.deliveryDate} : null;
        existingPhotoMeta = existing ? {photoCount: existing.photoCount, photosViewedAt: existing.photosViewedAt, photosUpdatedAt: existing.photosUpdatedAt} : null;
      }
      const lastStatus = history.length ? history[history.length-1].status : null;
      const statusChanged = status !== lastStatus;
      if(statusChanged){
        history.push({status, date:new Date().toISOString()});
      }
      const pkg = {trackingId, name, phone: normalizePhone(phone), status, destCountry, destDepartment, destCommune, updatedAt:new Date().toISOString(), history, companyCode: adminSession.code};
      if(existingPickedUpAt) pkg.pickedUpAt = existingPickedUpAt;
      if(existingHidden){ pkg.hiddenByClient = true; pkg.hiddenByClientAt = (existingHidden === true) ? null : existingHidden; }
      if(colisNum) pkg.colisNum = colisNum;
      if(deliveryDays){
        pkg.deliveryDays = deliveryDays;
        pkg.deliveryDate = (existingDelivery && existingDelivery.days === deliveryDays && existingDelivery.date) ? existingDelivery.date : dateFromDays(deliveryDays);

      if(existingPhotoMeta){ Object.keys(existingPhotoMeta).forEach(k => { if(existingPhotoMeta[k] !== undefined) pkg[k] = existingPhotoMeta[k]; }); }

      openClientGroups.add(pkg.phone);
      if(statusChanged) sendStatusEmail(pkg);

      renderAdmin();

function compressSmall(file){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const m = 1400; let w = img.width, h = img.height;
        if(w > h){ if(w > m){ h = h*(m/w); w = m; } } else { if(h > m){ w = w*(m/h); h = m; } }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        let out = c.toDataURL('image/jpeg', 0.82);
        if(out.length > 900000) out = c.toDataURL('image/jpeg', 0.6);
        if(out.length > 950000) out = c.toDataURL('image/jpeg', 0.4);
        resolve(out);
      };
      img.onerror = reject; img.src = e.target.result;
    };
    r.onerror = reject; r.readAsDataURL(file);
  });
}

  btn.type = 'button';
  btn.id = 'clientSupportBtn';

  document.body.appendChild(btn);
}

async function renderAdmin(){
  if(mode === 'company'){
    if(companyScreen === 'colis' && adminSession){
      await renderAdminCore();
      companyFixLogoutBtn();
      return;
    }
    return renderCompany();
  }
  return renderAdminCore();
}

function companyFixLogoutBtn(){
  const lb = document.getElementById('btnAdminLogout');
  if(lb){
    lb.textContent = 'Déconnexion';
    lb.className = 'ghost';
    lb.onclick = ()=>{ adminSession = null; editingTrackingId = null; companySession = null; companyScreen = 'home'; renderCompany(); };
  }
}

function updateCompanyBar(){
  const bar = document.getElementById('companyBar');
  if(!bar) return;
  if(mode === 'company' && companySession && companyScreen !== 'home'){
    const titles = {colis:'📦 Colis', settings:'⚙️ Paramètre', client:'👤 Client'};
    bar.style.display = 'block';
    bar.innerHTML = `<div style="display:flex;align-items:center;gap:10px;"><button class="menuBackBtn" id="btnCompanyBack"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M19 12H5M11 5l-7 7 7 7"/></svg><span>Menu</span></button><b style="font-size:14px;">${titles[companyScreen] || ''}</b></div>`;
    document.getElementById('btnCompanyBack').onclick = ()=>{ adminSession = null; editingTrackingId = null; companyScreen = 'home'; renderCompany(); };

  }

}
// Numéro WhatsApp du support : celui de l'entreprise dans son espace Client, sinon SamTraceStore
function supportTargetNumber(){
  if(mode === 'company' && companySession && companySession.phone){
    let d = String(companySession.phone).replace(/\D/g, '');
    if(d.length === 8) d = '509' + d;
    return d;
  }
  return WHATSAPP_NUMBER;
}

async function changeCompanyCode(oldCode, newCode){
  if(!/^\d{4}$/.test(newCode)){ const e = new Error('FORMAT'); e.code = 'FORMAT'; throw e; }
  if(newCode === oldCode){ const e = new Error('SAME'); e.code = 'SAME'; throw e; }
  const ownerCode = await getOwnerCode();
  const taken = await db.collection('companies').doc(newCode).get();
  if(taken.exists || (ownerCode && ownerCode === newCode)){ const e = new Error('TAKEN'); e.code = 'TAKEN'; throw e; }
  const oldDoc = await db.collection('companies').doc(oldCode).get();
  if(!oldDoc.exists){ const e = new Error('MISSING'); e.code = 'MISSING'; throw e; }
  const data = Object.assign({}, oldDoc.data(), {code:newCode, codeChangedAt:new Date().toISOString()});
  await db.collection('companies').doc(newCode).set(data);
  const snap = await db.collection('packages').where('companyCode','==',oldCode).get();
  for(let i=0; i<snap.docs.length; i+=400){
    const batch = db.batch();
    snap.docs.slice(i, i+400).forEach(d=> batch.update(d.ref, {companyCode:newCode}));
    await batch.commit();
  }
  await db.collection('companies').doc(oldCode).delete();
}

const GUIDE_HTML = "<div style=\"background:#0B1120;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.18);padding:46px 18px;margin-bottom:18px;text-align:center;\"><div style=\"display:inline-block;background:#FF6A00;color:#fff;font-weight:800;font-size:26px;padding:22px 30px;border-radius:18px;\">STS</div><div style=\"color:#fff;font-weight:800;font-size:26px;margin-top:26px;\">Guide de l'entreprise</div><div style=\"color:#FFD9BF;font-size:14px;margin-top:8px;line-height:1.4;\">Comment utiliser la partie Entreprise de l'application Sam Trace Store - Suivi de colis</div></div><div style=\"background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.18);padding:20px 18px 14px;margin-bottom:18px;\"><h2 style=\"color:#FF6A00;font-size:19px;margin:6px 0 10px;\">1. Se connecter</h2><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">1</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Ouvrez l'application et touchez le bouton <b>Entreprise</b> (en haut).</div></div><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">2</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Entrez le <b>code à 4 chiffres</b> de votre entreprise, puis touchez <b>Accéder</b>.</div></div><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">3</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Pas encore inscrit ? Touchez <b>S'inscrire (Admin)</b> et remplissez le formulaire d'inscription.</div></div><div style=\"margin:10px 0;padding:10px 12px;border-left:4px solid #FF6A00;background:#FFF1E6;font-size:13.5px;line-height:1.5;color:#4A5568;\">Après 5 mauvais codes, l'accès à l'espace est bloqué pendant 10 minutes sur ce téléphone. Les autres espaces et les autres téléphones ne sont pas touchés. Si l'internet est coupé, ce n'est pas compté comme une erreur.</div><h2 style=\"color:#FF6A00;font-size:19px;margin:6px 0 10px;\">2. Le menu de votre espace</h2><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\">Une fois connecté, vous voyez trois grands boutons :</p><ul style=\"margin:0 0 8px;padding-left:20px;line-height:1.55;font-size:14.5px;color:#1A202C;\"><li style=\"margin-bottom:4px;\"><b>Colis</b> : ajouter et suivre vos colis.</li><li style=\"margin-bottom:4px;\"><b>Paramètre</b> : vos notifications, votre code, le support STS, ce guide et votre logo.</li><li style=\"margin-bottom:4px;\"><b>Client</b> : voir l'application comme vos clients et la tester.</li></ul><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\">Pour revenir au menu, touchez le bouton orange <b>Menu</b> en haut. Le bouton <b>Déconnexion</b> vous renvoie à l'écran du code.</p><div style=\"margin-top:18px;text-align:center;font-size:10.5px;color:#718096;\">Sam Trace Store - Suivi de colis &nbsp;|&nbsp; Guide de l'entreprise &nbsp;|&nbsp; page 2</div></div><div style=\"background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.18);padding:20px 18px 14px;margin-bottom:18px;\"><h2 style=\"color:#FF6A00;font-size:19px;margin:6px 0 10px;\">3. Ajouter un colis</h2><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">1</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Touchez <b>Colis</b>, puis descendez jusqu'à <b>Ajouter un colis</b>.</div></div><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">2</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Écrivez le <b>numéro de suivi</b> (exemple : STS-2026-001).</div></div><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">3</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Écrivez le <b>nom</b> et le <b>téléphone</b> du client. Le client retrouvera ses colis avec ce numéro de téléphone.</div></div><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">4</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Choisissez la <b>destination</b> (pays, département, commune). Elle décide si le client voit un livreur moto ou un camion (voir la partie 4).</div></div><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">5</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Choisissez le <b>statut</b> (voir la partie 4) et, si vous voulez, le nombre de jours avant la livraison.</div></div><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">6</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Touchez <b>Enregistrer le colis</b>.</div></div><div style=\"font-weight:800;font-size:15px;margin:14px 0 4px;color:#0B1120;\">Ajouter des photos du colis</div><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\">Dans la liste <b>Tous les colis</b>, ajoutez jusqu'à <b>6 photos</b> par colis. Elles aident à montrer le colis au client et à STS.</p><div style=\"margin-top:18px;text-align:center;font-size:10.5px;color:#718096;\">Sam Trace Store - Suivi de colis &nbsp;|&nbsp; Guide de l'entreprise &nbsp;|&nbsp; page 3</div></div><div style=\"background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.18);padding:20px 18px 14px;margin-bottom:18px;\"><h2 style=\"color:#FF6A00;font-size:19px;margin:6px 0 10px;\">4. Les statuts et la livraison</h2><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\">Changez le statut à chaque étape : votre client voit le changement dans l'application. S'il a donné son email, il reçoit aussi un message.</p><div style=\"display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid #E2C8B0;\"><div style=\"flex:0 0 120px;font-weight:800;font-size:13.5px;color:#0B1120;\">En préparation</div><div style=\"font-size:13.5px;line-height:1.45;color:#1A202C;\">Vous préparez le colis.</div></div><div style=\"display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid #E2C8B0;\"><div style=\"flex:0 0 120px;font-weight:800;font-size:13.5px;color:#0B1120;\">Expédié</div><div style=\"font-size:13.5px;line-height:1.45;color:#1A202C;\">Le colis est parti.</div></div><div style=\"display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid #E2C8B0;\"><div style=\"flex:0 0 120px;font-weight:800;font-size:13.5px;color:#0B1120;\">En cours de livraison</div><div style=\"font-size:13.5px;line-height:1.45;color:#1A202C;\">Le livreur ou le chauffeur est en route chez le client.</div></div><div style=\"display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid #E2C8B0;\"><div style=\"flex:0 0 120px;font-weight:800;font-size:13.5px;color:#0B1120;\">En attente</div><div style=\"font-size:13.5px;line-height:1.45;color:#1A202C;\">Le colis attend avant de continuer.</div></div><div style=\"display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid #E2C8B0;\"><div style=\"flex:0 0 120px;font-weight:800;font-size:13.5px;color:#0B1120;\">Disponible au bureau</div><div style=\"font-size:13.5px;line-height:1.45;color:#1A202C;\">Le client peut venir le récupérer au bureau.</div></div><div style=\"display:flex;gap:10px;padding:8px 2px;border-bottom:1px solid #E2C8B0;\"><div style=\"flex:0 0 120px;font-weight:800;font-size:13.5px;color:#0B1120;\">Livré</div><div style=\"font-size:13.5px;line-height:1.45;color:#1A202C;\">Le client a bien reçu son colis.</div></div><div style=\"font-weight:800;font-size:15px;margin:14px 0 4px;color:#0B1120;\">Livraison à moto</div><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\">Pour les destinations proches (département <b>Ouest</b>), le client voit un <b>livreur à moto</b>. Quand le livreur part, choisissez <b>En cours de livraison</b> : le client lit « Votre livreur est en route ».</p><h2 style=\"color:#FF6A00;font-size:19px;margin:6px 0 10px;\">Livraison en voiture ou en camion</h2><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\">Pour les autres départements d'Haïti, le client voit un <b>chauffeur en camion</b> : « Votre chauffeur est en route ».</p><div style=\"margin:10px 0;padding:10px 12px;border-left:4px solid #FF6A00;background:#FFF1E6;font-size:13.5px;line-height:1.5;color:#4A5568;\">Il n'y a <b>pas de statut séparé</b> pour la moto, la voiture ou le camion. Utilisez toujours <b>En cours de livraison</b>. L'application choisit toute seule moto ou camion selon la <b>destination</b> du colis. Donc, si le département n'est pas le bon, le client verra le mauvais véhicule.</div><div style=\"font-weight:800;font-size:15px;margin:14px 0 4px;color:#0B1120;\">Retrait au bureau</div><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\">Si le client vient chercher son colis : mettez <b>Disponible au bureau</b>, puis <b>Livré</b> quand il l'a récupéré.</p><div style=\"margin-top:18px;text-align:center;font-size:10.5px;color:#718096;\">Sam Trace Store - Suivi de colis &nbsp;|&nbsp; Guide de l'entreprise &nbsp;|&nbsp; page 4</div></div><div style=\"background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.18);padding:20px 18px 14px;margin-bottom:18px;\"><h2 style=\"color:#FF6A00;font-size:19px;margin:6px 0 10px;\">5. Suivre vos colis</h2><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\"><b>Tous les colis</b> : la liste de toutes vos livraisons, avec le nom du client, le statut et les photos. Vous pouvez modifier un colis ou changer son statut.</p><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\"><b>Recherche</b> : tapez un nom, un téléphone ou un numéro de suivi dans la barre au-dessus de « Tous les colis » pour retrouver un client tout de suite.</p><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\"><b>Suivi par destination</b> : choisissez un mois et un département pour voir combien de colis vont à chaque endroit.</p><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\"><b>Relance</b> : si un colis est disponible depuis plusieurs jours, vous pouvez rappeler le client par WhatsApp.</p><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\"><b>Colis supprimés par les clients</b> : si un client supprime sa liste, son nom et ses colis apparaissent ici. Les colis restent dans votre historique.</p><h2 style=\"color:#FF6A00;font-size:19px;margin:6px 0 10px;\">6. Voir comme un client</h2><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\">Touchez <b>Client</b> dans le menu pour tester ce que vos clients voient : suivi par numéro de téléphone ou par numéro de suivi. Le bouton vert <b>Partager le lien</b> sert à envoyer l'application à vos clients par WhatsApp.</p><div style=\"margin-top:18px;text-align:center;font-size:10.5px;color:#718096;\">Sam Trace Store - Suivi de colis &nbsp;|&nbsp; Guide de l'entreprise &nbsp;|&nbsp; page 5</div></div><div style=\"background:#fff;border-radius:6px;box-shadow:0 2px 12px rgba(0,0,0,0.18);padding:20px 18px 14px;margin-bottom:18px;\"><h2 style=\"color:#FF6A00;font-size:19px;margin:6px 0 10px;\">7. Votre code d'accès</h2><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">1</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Allez dans <b>Paramètre</b>.</div></div><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">2</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Touchez <b>Voir</b> pour afficher votre code actuel.</div></div><div style=\"display:flex;gap:10px;margin-bottom:7px;align-items:stretch;\"><span style=\"flex:0 0 26px;background:#FF6A00;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;\">3</span><div style=\"line-height:1.5;font-size:14.5px;padding:2px 0;color:#1A202C;\">Écrivez le nouveau code (4 chiffres), confirmez-le, puis touchez <b>Changer mon code</b>.</div></div><div style=\"margin:10px 0;padding:10px 12px;border-left:4px solid #FF6A00;background:#FFF1E6;font-size:13.5px;line-height:1.5;color:#4A5568;\">Ne donnez votre code à personne. Si vous le changez, utilisez le nouveau code à la prochaine connexion.</div><h2 style=\"color:#FF6A00;font-size:19px;margin:6px 0 10px;\">8. Contacter le support STS en cas d'urgence</h2><d iv><p style=\"margin:0 0 9px;line-height:1.55;font-size:14.5px;color:#1A202C;\">STS peut bloquer temporairement une entreprise. Contactez le support pour demander le déblocage.</p><div style=\"margin:10px 0;padding:10px 12px;border-left:4px solid #FF6A00;background:#FFF1E6;font-size:13.5px;line-height:1.5;color:#4A5568;\"><b>Besoin d'aide ?</b> Utilisez le bouton Support STS dans Paramètre, ou écrivez-nous sur WhatsApp. Merci de travailler avec Sam Trace Store.</div><div style=\"margin-top:18px;text-align:center;font-size:10.5px;color:#718096;\">Sam Trace Store - Suivi de colis &nbsp;|&nbsp; Guide de l'entreprise &nbsp;|&nbsp; page 8</div></div>";
function downloadGuidePdf(){
  try{
    const bin = atob(GUIDE_PDF_B64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], {type:'application/pdf'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'guide-entreprise.pdf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
    toast("📄 Guide PDF téléchargé");
  }catch(e){ toast("Impossible de télécharger le guide"); }
}

  const logoImgEl = document.getElementById('logoPrevImg');
  function applyLogoPrev(){
    logoImgEl.style.cssText = 'display:block;height:220px;width:auto;max-width:300px;object-fit:contain;transform:scale(' + (document.getElementById('logoZ').value / 100) + ');transform-origin:' + document.getElementById('logoX').value + '% ' + document.getElementById('logoY').value + '%;';
  }
  function syncLogoSliders(){
    const zoomed = parseInt(document.getElementById('logoZ').value) > 100;
    ['logoX','logoY'].forEach(id => { const el = document.getElementById(id); el.disabled = !zoomed; el.style.opacity = zoomed ? '1' : '0.35'; });
    document.getElementById('logoHint').style.display = zoomed ? 'none' : 'block';
  }
  ['logoZ','logoX','logoY'].forEach(id => { document.getElementById(id).oninput = ()=>{ applyLogoPrev(); syncLogoSliders(); }; });
  syncLogoSliders();
  document.getElementById('btnLogoPick').onclick = ()=> document.getElementById('logoPickInput').click();
  document.getElementById('logoPickInput').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      pendingLogo = await compressLogo(file);
      logoImgEl.src = pendingLogo;
      document.getElementById('logoPrevEmpty').style.display = 'none';
      document.getElementById('logoPrevFrame').style.display = 'inline-block';
      document.getElementById('logoEditor').style.display = 'block';
      document.getElementById('logoZ').value = 100; document.getElementById('logoX').value = 50; document.getElementById('logoY').value = 50;
      applyLogoPrev(); syncLogoSliders();
    }catch(err){ toast("Image illisible, essayez une autre"); }
  };
  document.getElementById('btnSaveLogo').onclick = async ()=>{
    const data = {
      logoZoom: parseInt(document.getElementById('logoZ').value),
      logoPosX: parseInt(document.getElementById('logoX').value),
      logoPosY: parseInt(document.getElementById('logoY').value)
    };
    if(pendingLogo){ data.logoUrl = pendingLogo; data.logoHD = true; }
    try{
      await db.collection('companies').doc(companySession.code).set(data, {merge:true});
      logActivity(companySession.code, '🖼️', 'Logo mis à jour', 'Le logo de l\'entreprise a été modifié.');
      toast('Logo enregistré ✅');
      renderCompany();
    }catch(err){ toast("Erreur lors de l'enregistrement"); }
  };
  document.getElementById('btnCoSupport').onclick = ()=>openSupportModal(true);
  document.getElementById('btnGuidePdf').onclick = (e)=>{ e.preventDefault(); openGuide(); };
  let shown = false;
  document.getElementById('btnShowCode').onclick = ()=>{
    shown = !shown;
    document.getElementById('curCode').textContent = shown ? companySession.code : '••••';
    document.getElementById('btnShowCode').textContent = shown ? '🙈 Cacher' : '👁️ Voir';
  };
  document.getElementById('btnChangeCode').onclick = async ()=>{
    const c1 = document.getElementById('newCode').value.trim();
    const c2 = document.getElementById('newCode2').value.trim();
    if(!/^\d{4}$/.test(c1)){ toast("Le code doit avoir exactement 4 chiffres"); return; }
    if(c1 !== c2){ toast("Les deux codes ne sont pas pareils"); return; }
    if(!confirm("Changer votre code ? Vous devrez utiliser le nouveau code pour vous connecter.")) return;
    try{
      await changeCompanyCode(companySession.code, c1);
      companySession.code = c1;
      toast("✅ Code changé. Nouveau code : " + c1);
      renderCompany();
    }catch(e){
      if(e.code === 'TAKEN') toast("Ce code est déjà utilisé. Choisissez-en un autre.");
      else if(e.code === 'SAME') toast("C'est déjà votre code actuel.");
      else if(e.code === 'FORMAT') toast("Le code doit avoir exactement 4 chiffres");
      else toast("Erreur, réessayez");
    }
  };
}

async function renderCompany(){
  const main = document.getElementById('main');
  if(!companySession){
    adminSession = null;
    updateCompanyBar();
    const lockoutMinutes = checkLoginLockout('company');
    main.innerHTML = `
      ${firebaseWarningHTML()}
      <div class="card">
        <h2>Espace Entreprise</h2>
        ${lockoutMinutes > 0 ? `<div class="warnBox" style="color:var(--danger);border-color:rgba(239,93,93,0.3);background:rgba(239,93,93,0.1);">🔒 Trop de tentatives échouées. Réessayez dans ${lockoutMinutes} minute${lockoutMinutes>1?'s':''}.</div>` : `
        <p class="sub">Entrez le code de votre entreprise. Pas encore inscrit ? Inscrivez-vous d'abord avec le bouton Admin.</p>
        <label>Code (4 chiffres)</label>
        <div style="position:relative;">
          <input id="coPin" type="text" inputmode="numeric" maxlength="4" placeholder="••••" style="padding-right:46px;-webkit-text-security:disc;">
          <button type="button" id="coTogglePin" style="position:absolute;right:10px;top:9px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;">🙈</button>
        </div>
        <button class="primary" id="coUnlock">Accéder</button>
        <button class="ghost" style="margin-top:10px;width:100%;" id="coGoRegister">Nouvelle entreprise ? S'inscrire (Admin)</button>`}
      </div>
      ${whatsappBubbleHTML()}`;
    if(lockoutMinutes > 0) return;
    document.getElementById('coGoRegister').onclick = ()=>{ showCompanyRegister = true; setMode('admin'); };
    document.getElementById('coTogglePin').onclick = ()=>{
      const inp = document.getElementById('coPin'); const btn = document.getElementById('coTogglePin');
      const hidden = inp.style.webkitTextSecurity !== 'none';
      inp.style.webkitTextSecurity = hidden ? 'none' : 'disc'; btn.textContent = hidden ? '👁️' : '🙈';
    };
    document.getElementById('coUnlock').onclick = async ()=>{
      const code = document.getElementById('coPin').value.trim().replace(/\D/g, '');
      if(!firebaseReady){ toast("Firebase non configuré"); return; }
      if(!/^\d{4}$/.test(code)){ toast("Entrez les 4 chiffres de votre code"); return; }
      const unlockBtn = document.getElementById('coUnlock');
      if(unlockBtn.disabled) return;
      unlockBtn.disabled = true; unlockBtn.textContent = 'Vérification...';
      const restoreBtn = ()=>{ const b = document.getElementById('coUnlock'); if(b){ b.disabled = false; b.textContent = 'Accéder'; } };
      try{
        let company = null;
        try{
          const cd = await firestoreGetWithRetry(db.collection('companies').doc(code));
          company = cd.exists ? cd.data() : null;
        }catch(e){ restoreBtn(); toast("Problème de connexion internet. Réessayez : ce n'est pas compté comme une erreur de code."); return; }
        if(!company){
          registerFailedLogin('company');
          toast("Code invalide. Inscrivez d'abord votre entreprise avec le bouton Admin.");
          renderCompany();
          return;
        }
        clearLoginLockout('company');
        if(company.blocked){
          main.innerHTML = `<div class="card"><div class="warnBox" style="color:var(--danger);border-color:rgba(239,93,93,0.3);background:rgba(239,93,93,0.1);">
            🚫 Vous avez été temporairement bloqué par SamTraceStore. Veuillez contacter le support.</div></div>${whatsappBubbleHTML()}`;
          return;
        }
        if(company.justUnblocked){
          await db.collection('companies').doc(code).set({justUnblocked:false},{merge:true});
          toast("✅ SamTraceStore a débloqué votre accès");
        }
        companySession = {code, companyName: company.companyName, phone: company.companyPhone};
        companyScreen = 'home';
        renderCompany();
      }catch(e){ restoreBtn(); toast("Erreur, réessayez"); }
    };
    return;
  }

  if(companyScreen === 'colis'){
    adminSession = {code: companySession.code, isOwner:false, companyName: companySession.companyName};
    updateCompanyBar();
    await renderAdminCore();
    companyFixLogoutBtn();
    return;
  }
  adminSession = null;
  updateCompanyBar();
  if(companyScreen === 'client'){ await renderClient(); return; }
  if(companyScreen === 'settings'){ await renderCompanySettings(main); return; }

  const co = await getCompanyByCode(companySession.code);
  const logoBox = (co && co.logoUrl)
    ? logoBoxHTML(co, 80, '18px', 'border:2px solid var(--accent);box-shadow:0 6px 18px rgba(255,106,0,0.35);')
    : `<div style="width:80px;height:80px;border-radius:18px;border:2px dashed var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--accent2);line-height:1.2;text-align:center;"><span style="font-size:22px;">📷</span>Mon logo</div>`;
  main.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <div style="flex:1;min-width:0;"><p class="sub" style="margin:0">Entreprise</p><b style="word-break:break-word;">${escHtml(companySession.companyName || '')}</b></div>
      <div id="coLogoBtn" style="cursor:pointer;position:relative;flex:0 0 auto;">
        ${logoBox}
        <span style="position:absolute;right:-6px;bottom:-6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.4);">✎</span>
      </div>
      <button class="ghost" id="btnCompanyLogout" style="flex:0 0 auto;padding:8px 12px;font-size:13px;">Déconnexion</button>
    </div>
    <button class="primary bigOrange" id="coBtnColis"><span class="bi">📦</span><span>Colis<br><span style="font-size:12px;font-weight:500;opacity:.85;">Ajouter et suivre vos colis</span></span></button>
    <button class="primary bigOrange" id="coBtnSettings"><span class="bi">⚙️</span><span>Paramètre<br><span style="font-size:12px;font-weight:500;opacity:.85;">Mon code, support et guide</span></span></button>
    <button class="primary bigOrange" id="coBtnClient"><span class="bi">👤</span><span>Client<br><span style="font-size:12px;font-weight:500;opacity:.85;">Voir comme vos clients et tester</span></span></button>
    ${whatsappBubbleHTML()}`;
  document.getElementById('coBtnColis').onclick = ()=>{ companyScreen = 'colis'; renderCompany(); };
  document.getElementById('coBtnSettings').onclick = ()=>{ companyScreen = 'settings'; renderCompany(); };
  document.getElementById('coBtnClient').onclick = ()=>{ companyScreen = 'client'; renderCompany(); };
  document.getElementById('btnCompanyLogout').onclick = ()=>{ companySession = null; companyScreen = 'home'; renderCompany(); };
  document.getElementById('coLogoBtn').onclick = ()=>{ companyScreen = 'settings'; renderCompany(); };
}

function setMode(m){
  if(mode === 'admin') adminStash = adminSession;
  mode = m;
  adminSession = (m === 'admin') ? adminStash : null;
  if(m === 'company') companyScreen = 'home';
  document.getElementById('btnClientMode').classList.toggle('active', m === 'client');
  document.getElementById('btnAdminMode').classList.toggle('active', m === 'admin');
  document.getElementById('btnCompanyMode').classList.toggle('active', m === 'company');
  updateCompanyBar();
  render();
}

function render(){
  if(mode === 'client') renderClient();
  else if(mode === 'company') renderCompany();
  else renderAdmin();
  renderShareFooter();
  renderSupportButton();
}

document.getElementById('btnClientMode').onclick = ()=>{ setMode('client'); };
document.getElementById('btnAdminMode').onclick = ()=>{ setMode('admin'); };
document.getElementById('btnCompanyMode').onclick = ()=>{ setMode('company'); };

render();
loadSupportAvatar().then(()=>{ if(supportAvatarUrl) render(); });

document.addEventListener('click', (e)=>{
  const zoomEl = e.target.closest('[data-zoom]');
  if(zoomEl){
    document.getElementById('lightboxImg').src = zoomEl.dataset.zoom;
    document.getElementById('lightbox').classList.add('show');
    return;
  }
  if(e.target.id === 'lightbox' || e.target.id === 'lightboxClose'){
    document.getElementById('lightbox').classList.remove('show');
  }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
